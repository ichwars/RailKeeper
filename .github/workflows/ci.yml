name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-workflow:
    name: Release workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test release publication guards
        run: python3 .github/scripts/test_release_workflow.py
      - name: Check release compiler alignment
        run: python3 .github/scripts/check_go_toolchain.py
      - name: Test compiler drift rejection
        run: python3 .github/scripts/test_go_toolchain.py
      - name: Enforce executable source file budgets
        run: |
          python3 tools/check_source_size.py
          python3 -m unittest discover -s tools -p test_source_size.py
      - name: Test Compose security configuration
        run: python3 .github/scripts/test_compose_security.py
      - name: Test cross-package coverage guard
        run: python3 -m unittest discover -s tools -p test_go_coverage.py
      - name: Test complete race shard verification
        run: python3 -m unittest discover -s tools -p test_go_race_shard.py
      - name: Test disposable pilot bootstrap
        run: python3 -m unittest discover -s tools -p test_strix_pilot.py

  backend:
    name: Backend tests
    needs: [backend-coverage, backend-minimum, backend-race, backend-fuzz, release-workflow]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all backend quality checks
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ["QUALITY_RESULTS"])
          failed = {name: value["result"] for name, value in results.items() if value["result"] != "success"}
          if not results or failed:
              raise SystemExit(f"Backend quality checks did not all pass: {failed}")
          print("Coverage, minimum compiler, race groups, bounded fuzz and release/toolchain policy all passed.")
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download race execution manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: race-shard-*
          path: output/ci-race
          merge-multiple: true
      - name: Require complete original race group execution
        run: python3 tools/go_race_shard.py verify --directory output/ci-race

  backend-coverage:
    name: Backend coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache-dependency-path: backend/go.sum
      - name: Test backend
        working-directory: backend
        run: |
          go test -coverpkg=./internal/... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out > coverage-functions.txt
          tail -1 coverage-functions.txt
          python3 ../tools/check_go_coverage.py --profile coverage.out --report coverage-summary.json
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage-functions.txt
            backend/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

  backend-minimum:
    name: Backend minimum Go
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test declared minimum compiler
        working-directory: backend
        run: go test ./...

  backend-race:
    name: Backend race (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: rules-storage
            packages: ./internal/exhibition ./internal/infrastructure/exhibitiondata ./internal/configuration ./internal/infrastructure/settingsdata ./internal/media ./internal/infrastructure/blobdata ./internal/inventory/... ./internal/transfer/... ./internal/authentication/... ./internal/credentials ./internal/decoder/... ./internal/ecosmodel ./internal/backup ./internal/valuation ./internal/infrastructure/vehicledata ./internal/infrastructure/catalogdata ./internal/infrastructure/workshopdata ./internal/infrastructure/masterdatastore ./internal/infrastructure/numberingdata ./internal/infrastructure/overviewdata ./internal/infrastructure/authdata ./internal/infrastructure/transferfiles ./internal/infrastructure/backupdata ./internal/infrastructure/valuationdata
            tests: .
          - scope: exhibition
            packages: ./internal/application ./internal/api
            tests: ^Test(Exhibition|CompletedAndArchivedExhibitions)
          - scope: configuration
            packages: ./internal/application ./internal/api
            tests: ^Test(Configuration|UserSettings|DigitalCenter.*Settings|DigitalCenterWorkspace.*Settings)
          - scope: inventory-media
            packages: ./internal/application ./internal/api
            tests: ^Test(VehicleImages|VehiclePersistsImages|VehicleCreatesAndDeletesLocalImages|VehicleLinksMediaToMaintenance|ImageCreation|VehicleConflictRollsBackImages|AttachmentRevision|GuardedImageUpload|VehicleAndMediaRevision|MediaDeletion|VehicleSet|CreateVehicleSet|BlobMigrationReferenceFailure|MigrateFilesystemBlobs|FileBlob|DecoderConfigurationMediaMigration)
          - scope: authentication
            packages: ./internal/application ./internal/api
            tests: ^Test.*(Auth|Login|TOTP|TwoFactor|RateLimit|Password|Setup)
          - scope: transfer-ecos
            packages: ./internal/application ./internal/infrastructure
            tests: ^Test.*(DataTransfer|ECoS)
          - scope: backup-1
            shard_group: backup
            shard_index: 0
            shard_count: 3
          - scope: backup-2
            shard_group: backup
            shard_index: 1
            shard_count: 3
          - scope: backup-3
            shard_group: backup
            shard_index: 2
            shard_count: 3
          - scope: decoder-cv-1
            shard_group: decoder-cv
            shard_index: 0
            shard_count: 3
          - scope: decoder-cv-2
            shard_group: decoder-cv
            shard_index: 1
            shard_count: 3
          - scope: decoder-cv-3
            shard_group: decoder-cv
            shard_index: 2
            shard_count: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache-dependency-path: backend/go.sum
      - name: Check critical transaction and concurrency paths
        working-directory: backend
        env:
          RACE_PACKAGES: ${{ matrix.packages }}
          RACE_TESTS: ${{ matrix.tests }}
          RACE_SHARD_GROUP: ${{ matrix.shard_group }}
          RACE_SHARD_INDEX: ${{ matrix.shard_index || 0 }}
          RACE_SHARD_COUNT: ${{ matrix.shard_count || 1 }}
        run: |
          if [ "$RACE_SHARD_COUNT" -eq 1 ]; then
            go test -race -timeout=20m $RACE_PACKAGES -run "$RACE_TESTS" -count=1
          else
            python3 ../tools/go_race_shard.py run --group "$RACE_SHARD_GROUP" \
              --index "$RACE_SHARD_INDEX" --count "$RACE_SHARD_COUNT" \
              --log "../output/ci-race-${{ matrix.scope }}.jsonl"
          fi
      - name: Upload race execution evidence
        if: always() && matrix.shard_count == 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: race-shard-${{ matrix.scope }}
          path: |
            output/ci-race-${{ matrix.scope }}.jsonl
            output/ci-race-${{ matrix.scope }}.manifest.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  backend-fuzz:
    name: Backend bounded fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache-dependency-path: backend/go.sum
      - name: Fuzz password parser, protocol names, snapshots and backup paths
        working-directory: backend
        run: |
          go test ./internal/credentials -run '^$' -fuzz '^FuzzPasswordHashParser$' -fuzztime=10s -parallel=2
          go test ./internal/ecosmodel -run '^$' -fuzz '^FuzzQuotedComparisonName$' -fuzztime=10s -parallel=2
          go test ./internal/decoder -run '^$' -fuzz '^FuzzSnapshotPayload$' -fuzztime=10s -parallel=2
          go test ./internal/backup -run '^$' -fuzz '^FuzzBackupFileValidation$' -fuzztime=10s -parallel=2

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Lint backend
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          working-directory: backend
          args: --config=../.golangci.yml

  frontend:
    name: Frontend coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm run test:coverage
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/regression/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify the startup budget only warns
        working-directory: frontend
        run: node --test scripts/test-startup-budget.mjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache-dependency-path: backend/go.sum
      - name: Build backend for browser checks
        working-directory: backend
        run: go build -o "$RUNNER_TEMP/railkeeper-performance" ./cmd/railkeeper
      - name: Install Chromium for browser checks
        working-directory: tools/regression
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check browser performance regressions
        run: python3 tools/regression/check_performance.py --binary "$RUNNER_TEMP/railkeeper-performance"

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache-dependency-path: backend/go.sum
      - name: Test API contract
        working-directory: backend
        run: go test ./internal/api -run OpenAPI -count=1

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        working-directory: docs
        run: npm ci
      - name: Check documentation
        working-directory: docs
        run: npm run check
