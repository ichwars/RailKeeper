name: Windows Standalone Package

on:
  workflow_dispatch:
    inputs:
      qualification_tag:
        description: "Qualify an existing release tag with the reviewed test suite; upload workflow artifacts only"
        type: string
        required: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  windows-standalone:
    runs-on: windows-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      SOURCE_DIR: ${{ inputs.qualification_tag && '.cache/release-source' || '.' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the published source for requalification
        if: inputs.qualification_tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.qualification_tag }}
          path: .cache/release-source
          persist-credentials: false

      - name: Verify tag identity and application source
        if: inputs.qualification_tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.qualification_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+(\.[0-9]+){2,3}(-[0-9A-Za-z.-]+)?$') { throw "Invalid release tag" }
          $tag = git -C $env:SOURCE_DIR tag --points-at HEAD
          if ($LASTEXITCODE -ne 0 -or $env:RELEASE_TAG -notin @($tag)) { throw "Release tag does not identify checkout" }
          foreach ($path in @('backend', 'frontend', 'openapi', 'deploy/windows', '.go-version')) {
            $source = git -C $env:SOURCE_DIR rev-parse "HEAD:$path"
            if ($LASTEXITCODE -ne 0) { throw "Missing release object: $path" }
            $qualified = git rev-parse "HEAD:$path"
            if ($LASTEXITCODE -ne 0 -or $qualified -ne $source) { throw "Qualification source differs: $path" }
          }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.SOURCE_DIR }}/frontend
        run: npm ci

      - name: Build standalone package
        shell: pwsh
        run: .\tools\build_windows_standalone.ps1 -SourceRoot (Resolve-Path $env:SOURCE_DIR)

      - name: Calculate the Windows ZIP SHA-256 checksum
        id: checksum
        if: ${{ !inputs.qualification_tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path "dist/windows-standalone/RailKeeper-windows-x64-*.zip" -File)
          if ($files.Count -ne 1) { throw 'Exactly one Windows x64 ZIP is required.' }
          $zip = $files[0]
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "${hash}  $($zip.Name)`n" | Set-Content -LiteralPath (Join-Path $zip.DirectoryName 'checksums.txt') -Encoding ascii -NoNewline
          "subject=dist/windows-standalone/$($zip.Name)" >> $env:GITHUB_OUTPUT

      - name: Attest Windows ZIP build provenance
        id: attest
        if: ${{ !inputs.qualification_tag }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.checksum.outputs.subject }}

      - name: Stage provenance bundle
        if: ${{ !inputs.qualification_tag }}
        shell: pwsh
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: Copy-Item -LiteralPath $env:ATTESTATION_BUNDLE -Destination dist/windows-standalone/windows-provenance.jsonl

      - name: Upload sanitized qualification reports and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-qualification
          path: |
            output/windows-baseline-*/**/report.json
            output/windows-baseline-*/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: railkeeper-windows-standalone
          path: |
            ${{ env.SOURCE_DIR }}/dist/windows-standalone/*.zip
            dist/windows-standalone/checksums.txt
            dist/windows-standalone/windows-provenance.jsonl
          if-no-files-found: error
          overwrite: true

  verify-windows-package:
    if: ${{ !inputs.qualification_tag }}
    needs: windows-standalone
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download staged Windows package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: railkeeper-windows-standalone
          path: evidence

      - name: Verify checksum and source attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify_windows_release.sh evidence "$GITHUB_REF" "$GITHUB_SHA"

      - name: Reject branch attestations as release-tag evidence
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          packages=(evidence/RailKeeper-windows-x64-*.zip)
          tag="${packages[0]##*/}"
          tag="${tag#RailKeeper-windows-x64-}"
          tag="${tag%.zip}"
          if bash .github/scripts/verify_windows_release.sh evidence "refs/tags/$tag" "$GITHUB_SHA"; then
            echo "::error::A branch build was accepted as release-tag evidence."
            exit 1
          fi

      - name: Upload verified Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: railkeeper-windows-verified
          path: |
            evidence/RailKeeper-windows-x64-*.zip
            evidence/checksums.txt
            evidence/windows-provenance.jsonl
          if-no-files-found: error
          overwrite: true
