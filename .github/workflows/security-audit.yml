name: Security Audit

on:
  pull_request:
    paths:
      - backend/go.mod
      - backend/go.sum
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/security-audit.yml
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan reachable Go vulnerabilities
        working-directory: backend
        shell: bash
        run: |
          if ! govulncheck ./... > "$RUNNER_TEMP/govulncheck.txt" 2>&1; then
            echo "::error::Go vulnerability audit failed. Re-run govulncheck locally for details."
            exit 1
          fi

  npm-audit:
    name: npm runtime dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Scan runtime dependencies
        working-directory: frontend
        shell: bash
        run: |
          if ! npm audit --omit=dev --audit-level=high > "$RUNNER_TEMP/npm-audit.txt" 2>&1; then
            echo "::error::npm dependency audit failed. Re-run npm audit locally for details."
            exit 1
          fi
