version: 2

updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /tools/api-types
    # openapi-typescript 7.13 requires TypeScript ^5.x; the frontend compiler is separate.
    # Revisit this constraint when upgrading the generator's supported compiler API.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      api-types-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /tools/frontend-lint
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      frontend-lint-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    ignore:
      - dependency-name: node
        versions:
          - ">=25, <26"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
