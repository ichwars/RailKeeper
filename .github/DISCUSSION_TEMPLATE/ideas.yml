title: "[Idee / Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Hier sammeln wir gewünschte Arbeitsabläufe. Bestehende Ideen bitte ergänzen. Bestätigte Fehler gehören in die [Issues](https://github.com/ichwars/RailKeeper/issues/new/choose), Bedienfragen in [Q&A](https://github.com/ichwars/RailKeeper/discussions/categories/q-a).

        Suggest a workflow here, or add to an existing idea. Use [Issues](https://github.com/ichwars/RailKeeper/issues/new/choose) for confirmed bugs and [Q&A](https://github.com/ichwars/RailKeeper/discussions/categories/q-a) for usage questions.
  - type: textarea
    id: need
    attributes:
      label: Aufgabe und Problem / Task and problem
      description: "Was möchtest du erledigen und was erschwert es derzeit? / What are you trying to do and what makes it difficult today?"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Gewünschter Ablauf / Desired workflow
      description: "Beschreibe das gewünschte Ergebnis mit einem konkreten Beispiel. / Describe the desired outcome with a concrete example."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Bisherige Lösung und Nutzen / Current workaround and benefit
      description: "Wie löst du es heute, und wem würde die Verbesserung helfen? / How do you handle it today, and who would benefit?"
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Betroffener Bereich / Affected area
      placeholder: "z. B. Fahrzeuge, Zubehör, CVs, ECoS / e.g. vehicles, accessories, CVs, ECoS"
