openapi: 3.1.0
info:
  title: RailKeeper API
  version: 0.1.0
servers:
  - url: /api/v1
tags:
  - name: Setup
  - name: Auth
  - name: System
  - name: Users
  - name: Vehicles
  - name: Overview
  - name: InventoryNumbers
  - name: MasterData
  - name: ArticleSearch
  - name: Backup
  - name: Audit
  - name: Exhibition
  - name: Accessories
  - name: DataTransfer
  - name: DigitalCenters
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rk_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required together with the session cookie for API mutations.
  schemas:
    Problem:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    TransferDirection:
      type: string
      enum: [import, export]
    TransferFormat:
      type: string
      enum: [csv, railkeeper-json]
    TransferArea:
      type: string
      enum: [vehicles, accessories, exhibitionLists]
    TransferJobState:
      type: string
      enum: [draft, reading, review_required, ready, running, completed, completed_with_warnings, failed, cancelled]
    TransferJobStage:
      type: string
      enum: [created, snapshot, preview, review, completed, failed, cancelled]
    TransferIssueSeverity:
      type: string
      enum: [warning, error]
    TransferIssueResolution:
      type: string
      enum: [replace, merge, copy, skip, use_existing, create, link]
    TransferProposedAction:
      type: string
      enum: [create, replace, use_existing, copy]
    TransferProposedResolution:
      type: string
      enum: [replace, merge, copy, skip, use_existing, create, link, replace_or_copy]
    DataTransferProfile:
      type: object
      required: [id, name, direction, format, areas, options, enabled, createdByUserId, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        direction:
          $ref: "#/components/schemas/TransferDirection"
        format:
          $ref: "#/components/schemas/TransferFormat"
        areas:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TransferArea"
        options:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
        createdByUserId:
          type: string
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DataTransferProfileInput:
      type: object
      required: [name, direction, format, areas]
      properties:
        name:
          type: string
          minLength: 1
        direction:
          $ref: "#/components/schemas/TransferDirection"
        format:
          $ref: "#/components/schemas/TransferFormat"
        areas:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TransferArea"
        options:
          type: object
          additionalProperties: true
    DataTransferExportJobInput:
      type: object
      required: [profileId]
      properties:
        profileId:
          type: string
          minLength: 1
    DataTransferImportJobInput:
      type: object
      required: [profileId]
      properties:
        profileId:
          type: string
          minLength: 1
    DataTransferIssueResolutionInput:
      type: object
      required: [resolution]
      properties:
        resolution:
          $ref: "#/components/schemas/TransferIssueResolution"
          minLength: 1
    DataTransferImportConfirmationInput:
      type: object
      required: [confirm, expectedRevision]
      properties:
        confirm:
          type: boolean
        expectedRevision:
          type: integer
          minimum: 1
    DataTransferJob:
      type: object
      required: [id, profileId, profileName, direction, format, areas, options, state, stage, packageVersion, revision,
        sourceName, sourceSha256, totalRecords, readyRecords, warningRecords, errorRecords, preview, createdByUserId,
        confirmedByUserId, confirmedAt, completedAt, resultMessage, createdAt, updatedAt]
      properties:
        id:
          type: string
        profileId:
          type: string
        profileName:
          type: string
        direction:
          $ref: "#/components/schemas/TransferDirection"
        format:
          $ref: "#/components/schemas/TransferFormat"
        areas:
          type: array
          items:
            $ref: "#/components/schemas/TransferArea"
        options:
          type: object
          additionalProperties: true
        state:
          $ref: "#/components/schemas/TransferJobState"
        stage:
          $ref: "#/components/schemas/TransferJobStage"
        sourceName:
          type: string
        sourceSha256:
          type: string
        packageVersion:
          type: integer
        revision:
          type: integer
          minimum: 1
        totalRecords:
          type: integer
        readyRecords:
          type: integer
        warningRecords:
          type: integer
        errorRecords:
          type: integer
        preview:
          type: object
          additionalProperties: true
        createdByUserId:
          type: string
        confirmedByUserId:
          type: string
        confirmedAt:
          type: string
        completedAt:
          type: string
        resultMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DataTransferArtifact:
      type: object
      required: [id, jobId, relativePath, displayName, mimeType, sizeBytes, sha256, deletedAt, createdAt]
      properties:
        id:
          type: string
        jobId:
          type: string
        relativePath:
          type: string
        displayName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        sha256:
          type: string
        deletedAt:
          type: string
        createdAt:
          type: string
          format: date-time
    DataTransferExportResult:
      type: object
      required: [job, artifact, openFolderAvailable]
      properties:
        job:
          $ref: "#/components/schemas/DataTransferJob"
        artifact:
          $ref: "#/components/schemas/DataTransferArtifact"
        openFolderAvailable:
          type: boolean
    DataTransferIssue:
      type: object
      required: [id, jobId, area, recordKey, rowNumber, field, severity, code, message, proposedResolution,
        selectedResolution, createdAt, updatedAt]
      properties:
        id:
          type: string
        jobId:
          type: string
        area:
          $ref: "#/components/schemas/TransferArea"
        recordKey:
          type: string
        rowNumber:
          type: [integer, "null"]
        field:
          type: string
        severity:
          $ref: "#/components/schemas/TransferIssueSeverity"
        code:
          type: string
          description: >-
            Stable conflict or validation code. Vehicle-set groups additionally use
            duplicate_vehicle_set_inventory_number and vehicle_set_member_external_conflict.
        message:
          type: string
        proposedResolution:
          oneOf:
            - $ref: "#/components/schemas/TransferProposedResolution"
            - type: string
              maxLength: 0
        selectedResolution:
          oneOf:
            - $ref: "#/components/schemas/TransferIssueResolution"
            - type: string
              maxLength: 0
        createdAt:
          type: string
        updatedAt:
          type: string
    DataTransferPreviewRecord:
      type: object
      required: [area, recordKey, classification, proposedAction, data]
      properties:
        area:
          $ref: "#/components/schemas/TransferArea"
        recordKey:
          type: string
        rowNumber:
          type: integer
        classification:
          type: string
          enum: [ready, warning, error]
        proposedAction:
          $ref: "#/components/schemas/TransferProposedAction"
        targetId:
          type: string
        targetUpdatedAt:
          type: string
        targetFingerprint:
          type: string
          description: SHA-256 fingerprint of the complete transferable target aggregate at preview time.
        data:
          type: object
          additionalProperties: true
    DataTransferVehicleSetMember:
      type: object
      required: [vehicleId, vehicleInventoryNumber, position]
      properties:
        vehicleId:
          type: string
          description: Source vehicle ID used only to resolve members inside the transfer package.
        vehicleInventoryNumber:
          type: string
        position:
          type: integer
          minimum: 1
        label:
          type: string
    DataTransferVehicleSet:
      allOf:
        - $ref: "#/components/schemas/VehicleSetInput"
        - type: object
          required: [inventoryNumber, members]
          properties:
            id:
              type: string
              description: Source set ID. Target installations assign their own ID.
            inventoryNumber:
              type: string
            members:
              type: array
              minItems: 2
              items:
                $ref: "#/components/schemas/DataTransferVehicleSetMember"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    DataTransferVehicleSetDiagnostic:
      type: object
      required: [rowNumber, field, code]
      properties:
        rowNumber:
          type: integer
          minimum: 0
        field:
          type: string
        code:
          type: string
          description: Stable code for an invalid or inconsistent vehicle-set group.
    DataTransferVehicleSetPreview:
      type: object
      required: [recordKey, classification, proposedAction, memberRecordKeys, data]
      properties:
        recordKey:
          type: string
        classification:
          type: string
          enum: [ready, warning, error]
        proposedAction:
          $ref: "#/components/schemas/TransferProposedAction"
        targetId:
          type: string
        targetUpdatedAt:
          type: string
        targetFingerprint:
          type: string
          description: SHA-256 fingerprint of the complete target set and its memberships.
        memberRecordKeys:
          type: array
          minItems: 2
          items:
            type: string
        rowNumbers:
          type: array
          items:
            type: integer
            minimum: 1
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/DataTransferVehicleSetDiagnostic"
        data:
          $ref: "#/components/schemas/DataTransferVehicleSet"
    DataTransferCSVColumnMapping:
      type: object
      required: [index, sourceHeader, normalizedHeader, targetField, origin]
      properties:
        index:
          type: integer
          minimum: 0
        sourceHeader:
          type: string
        normalizedHeader:
          type: string
        targetField:
          type: string
        origin:
          type: string
          enum: [alias, profile, manual, ignored, unmapped]
    VehicleTransferField:
      type: object
      required: [key, labelDE, labelEN, kind, aliases]
      properties:
        key:
          type: string
        labelDE:
          type: string
        labelEN:
          type: string
        kind:
          type: string
          enum: [string, integer, boolean]
        aliases:
          type: array
          items:
            type: string
    DataTransferPreview:
      type: object
      required: [job, records, issues, totalRecords, readyRecords, warningRecords, errorRecords]
      properties:
        job:
          $ref: "#/components/schemas/DataTransferJob"
        records:
          type: array
          items:
            $ref: "#/components/schemas/DataTransferPreviewRecord"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/DataTransferIssue"
        totalRecords:
          type: integer
          description: Number of vehicle and other area records. Vehicle-set metadata is not counted separately.
        readyRecords:
          type: integer
          description: Ready area records. Vehicle-set metadata is not counted separately.
        warningRecords:
          type: integer
          description: Area records with warnings. Vehicle-set metadata is not counted separately.
        errorRecords:
          type: integer
          description: Area records with errors. Vehicle-set metadata is not counted separately.
        csvMapping:
          type: array
          items:
            $ref: "#/components/schemas/DataTransferCSVColumnMapping"
        vehicleFields:
          type: array
          items:
            $ref: "#/components/schemas/VehicleTransferField"
        vehicleSets:
          type: array
          description: Detected vehicle-set groups reviewed and resolved as one unit.
          items:
            $ref: "#/components/schemas/DataTransferVehicleSetPreview"
    DataTransferSummary:
      type: object
      required: [openJobs, selectedRecords, lastExportAt, artifactCount, artifactBytes,
        openFolderAvailable, artifactDirectory]
      properties:
        openJobs:
          type: integer
          minimum: 0
        selectedRecords:
          type: integer
          minimum: 0
        lastExportAt:
          type: string
        artifactCount:
          type: integer
          minimum: 0
        artifactBytes:
          type: integer
          format: int64
          minimum: 0
        openFolderAvailable:
          type: boolean
        artifactDirectory:
          type: string
    DataTransferJobDetails:
      type: object
      required: [job, issues, artifacts]
      properties:
        job:
          $ref: "#/components/schemas/DataTransferJob"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/DataTransferIssue"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/DataTransferArtifact"
    OverviewValuation:
      type: object
      required:
        - vehicleListValue
        - vehiclePurchaseValue
        - accessoryListValue
        - accessoryPurchaseCost
        - excludedForeignCurrencyPurchases
      properties:
        vehicleListValue:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        vehiclePurchaseValue:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        accessoryListValue:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        accessoryPurchaseCost:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        excludedForeignCurrencyPurchases:
          type: integer
          minimum: 0
    SetupStatus:
      type: object
      required: [setupRequired]
      properties:
        setupRequired:
          type: boolean
    CreateAdminRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 12
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        twoFactorCode:
          type: string
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 12
    Session:
      type: object
      required: [username, roles, csrfToken, twoFactorEnabled]
      properties:
        username:
          type: string
        roles:
          type: array
          items:
            type: string
        csrfToken:
          type: string
        twoFactorEnabled:
          type: boolean
    TwoFactorStatus:
      type: object
      required: [enabled, prepared]
      properties:
        enabled:
          type: boolean
        prepared:
          type: boolean
        enabledAt:
          type: string
          format: date-time
        username:
          type: string
        otpauthUrl:
          type: string
        secret:
          type: string
    TwoFactorEnableRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    TwoFactorDisableRequest:
      type: object
      required: [currentPassword]
      properties:
        currentPassword:
          type: string
        code:
          type: string
    SessionRecord:
      type: object
      required: [id, userId, username, createdAt, expiresAt, active]
      properties:
        id:
          type: string
        userId:
          type: string
        username:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        active:
          type: boolean
    Role:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    UserAccount:
      type: object
      required: [id, username, roles, createdAt, twoFactorEnabled]
      properties:
        id:
          type: string
        username:
          type: string
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        twoFactorEnabled:
          type: boolean
    UserAccountInput:
      type: object
      required: [username, roles]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 12
          description: Required when creating a user. Omit or leave empty on update to keep the current password.
        roles:
          type: array
          minItems: 1
          items:
            type: string
    AuditLogEntry:
      type: object
      required: [id, action, createdAt, detailsJson]
      properties:
        id:
          type: string
        actorUserId:
          type: string
        actorUsername:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        createdAt:
          type: string
          format: date-time
        detailsJson:
          type: string
    AuditLogResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
    SystemPrinters:
      type: object
      required: [status, message, printers]
      properties:
        status:
          type: string
          enum: [available, configured, unavailable]
        message:
          type: string
        defaultPrinter:
          type: string
        printers:
          type: array
          items:
            type: object
            required: [id, name, isDefault]
            properties:
              id:
                type: string
              name:
                type: string
              isDefault:
                type: boolean
    SMTPSettings:
      type: object
      required: [enabled, publicUrl, host, port, username, from, tlsMode, passwordConfigured]
      properties:
        enabled:
          type: boolean
        publicUrl:
          type: string
        host:
          type: string
        port:
          type: string
        username:
          type: string
        from:
          type: string
        tlsMode:
          type: string
          enum: [starttls, implicit, none]
        passwordConfigured:
          type: boolean
    SMTPSettingsInput:
      type: object
      required: [enabled, publicUrl, host, port, username, from, tlsMode]
      properties:
        enabled:
          type: boolean
        publicUrl:
          type: string
        host:
          type: string
        port:
          type: string
        username:
          type: string
        password:
          type: string
          description: Optional. Leave empty to keep the stored SMTP password.
        from:
          type: string
        tlsMode:
          type: string
          enum: [starttls, implicit, none]
        clearPassword:
          type: boolean
    SMTPTestRequest:
      type: object
      required: [recipient]
      properties:
        recipient:
          type: string
          format: email
    SettingsPayload:
      type: object
      required: [settings]
      properties:
        settings:
          type: object
          additionalProperties:
            type: string
    DigitalProviderSettings:
      type: object
      required: [enabled, host, port]
      properties:
        enabled:
          type: boolean
        host:
          type: string
        port:
          type: string
    DigitalCenterSettings:
      type: object
      required: [provider, ecos, z21, intellibox3, cs3]
      properties:
        provider:
          type: string
          enum: [ecos, z21, intellibox3, cs3]
        ecos:
          $ref: "#/components/schemas/DigitalProviderSettings"
        z21:
          $ref: "#/components/schemas/DigitalProviderSettings"
        intellibox3:
          $ref: "#/components/schemas/DigitalProviderSettings"
        cs3:
          $ref: "#/components/schemas/DigitalProviderSettings"
    DigitalCenterProvider:
      type: string
      enum: [ecos, z21, intellibox3, cs3]
    DigitalCenterConnectionInput:
      type: object
      required: [host, port]
      properties:
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
    ECoSConnectionResult:
      type: object
      required: [connected, host, port, compatibilityStatus, missingFields, message]
      properties:
        connected:
          type: boolean
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        status:
          type: string
        protocolVersion:
          type: string
        applicationVersion:
          type: string
        hardwareVersion:
          type: string
        compatibilityStatus:
          type: string
          enum: [unreachable, rejected, partial, unverified, verified]
        missingFields:
          type: array
          items:
            type: string
            enum: [status, ProtocolVersion, ApplicationVersion, HardwareVersion]
        message:
          type: string
        rawLines:
          type: array
          items:
            type: string
        fields:
          type: object
          additionalProperties:
            type: string
    DigitalCenterProbeCommandResult:
      type: object
      required: [name, description, commandHex, ok]
      properties:
        name:
          type: string
        description:
          type: string
        commandHex:
          type: string
          description: Binary command rendered as hexadecimal, empty for HTTP probes.
        request:
          type: string
          description: Sanitized read-only HTTP request or binary command description.
        responseHex:
          type: string
        header:
          type: string
        payloadHex:
          type: string
        ok:
          type: boolean
        error:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    DigitalCenterProbeResult:
      type: object
      required: [provider, connected, host, port, message, commands]
      properties:
        provider:
          $ref: "#/components/schemas/DigitalCenterProvider"
        connected:
          type: boolean
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
        commands:
          type: array
          items:
            $ref: "#/components/schemas/DigitalCenterProbeCommandResult"
    DigitalCenterCapabilities:
      type: object
      required: [testConnection, readLocomotives, liveMonitor, writeLocomotives, writeCVs, diagnose]
      properties:
        testConnection:
          type: boolean
        readLocomotives:
          type: boolean
        liveMonitor:
          type: boolean
        writeLocomotives:
          type: boolean
        writeCVs:
          type: boolean
        diagnose:
          type: boolean
    DigitalCenterTransport:
      type: object
      required: [id, status, capabilities]
      properties:
        id:
          type: string
          enum: [ecos_tcp, z21_udp, loconet_tcp, cs3_http]
        status:
          type: string
          enum: [available, planned]
        capabilities:
          $ref: "#/components/schemas/DigitalCenterCapabilities"
    DigitalCenterSummary:
      type: object
      required: [provider, name, active, selected, host, port, capabilities, transports]
      properties:
        provider:
          $ref: "#/components/schemas/DigitalCenterProvider"
        name:
          type: string
        active:
          type: boolean
        selected:
          type: boolean
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        capabilities:
          $ref: "#/components/schemas/DigitalCenterCapabilities"
        transports:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DigitalCenterTransport"
    DigitalCenterWorkspaceSummary:
      type: object
      required: [centers]
      properties:
        centers:
          type: array
          items:
            $ref: "#/components/schemas/DigitalCenterSummary"
    DigitalCenterReadSession:
      type: object
      required:
        [id, provider, state, host, port, capabilities, readStartedAt, readCompletedAt,
        createdByUserId, createdAt, updatedAt]
      properties:
        id:
          type: string
        provider:
          $ref: "#/components/schemas/DigitalCenterProvider"
        state:
          type: string
          enum: [reading, ready, interrupted, failed]
        host:
          type: string
        port:
          type: integer
        capabilities:
          $ref: "#/components/schemas/DigitalCenterCapabilities"
        readStartedAt:
          type: string
        readCompletedAt:
          type: string
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DigitalCenterStationSnapshot:
      type: object
      additionalProperties: false
      properties:
        objectId:
          type: integer
        name:
          type: string
        decoderAddress:
          type: integer
        protocol:
          type: string
    DigitalCenterVehicleSnapshot:
      type: object
      additionalProperties: false
      properties:
        vehicleId:
          type: string
        name:
          type: string
        decoderAddress:
          type: integer
        protocol:
          type: string
    DigitalCenterProposedMatch:
      type: object
      additionalProperties: false
      properties:
        vehicleId:
          type: string
        match:
          type: string
          enum: [address_protocol, address]
    DigitalCenterWorkItem:
      type: object
      required:
        [id, sessionId, centerObjectId, vehicleId, name, decoderAddress, protocol, compareStatus,
        stationStatus, center, railkeeper, proposed, conflicts, createdAt, updatedAt]
      properties:
        id:
          type: string
        sessionId:
          type: string
        centerObjectId:
          type: string
        vehicleId:
          type: string
        name:
          type: string
        decoderAddress:
          type: integer
        protocol:
          type: string
        compareStatus:
          type: string
          enum: [ok, deviation, missing, new, conflict]
        stationStatus:
          type: string
          enum: [read, incomplete, missing]
