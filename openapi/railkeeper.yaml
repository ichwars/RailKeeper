    BugReportArea:
      type: string
      enum: [overview, vehicles, accessories, exhibition, importExport, digitalCenters, settings, other]
    BugReportClientError:
      type: object
      additionalProperties: false
      required: [timestamp, category, errorClass, problemCode, message, method, route]
      properties:
        timestamp:
          type: string
          format: date-time
        category:
          type: string
          enum: [window, promise, api, network, timeout]
        errorClass:
          type: string
          enum: [AbortError, ApiError, DOMException, Error, RangeError, ReferenceError, SyntaxError, TypeError, UnhandledRejection]
        problemCode:
          type: string
          enum: ['', network_error, request_failed, request_timeout, unknown_error]
        message:
          type: string
          enum: [Unexpected client error, Unhandled promise rejection, API request failed, Network request failed, Request timed out]
        method:
          type: string
          enum: ['', DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
        route:
          type: string
          pattern: '^$|^/[a-z][a-z-]{0,39}$'
        status:
          type: integer
          minimum: 0
          maximum: 599
    BugReportClientDiagnostics:
      type: object
      additionalProperties: false
      required:
        [browserFamily, browserMajor, osFamily, osMajor, viewportWidth, viewportHeight, language,
         timeZone, theme, pathname, area, roles, errors]
      properties:
        browserFamily:
          type: string
          enum: [Chrome, Edge, Firefox, Safari, Unknown]
        browserMajor:
          type: string
          pattern: '^\d{0,4}$'
        osFamily:
          type: string
          enum: [Android, iOS, Linux, macOS, Unknown, Windows]
        osMajor:
          type: string
          pattern: '^\d{0,4}$'
        viewportWidth:
          type: integer
          minimum: 0
          maximum: 32768
        viewportHeight:
          type: integer
          minimum: 0
          maximum: 32768
        language:
          type: string
          maxLength: 35
          pattern: '^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$'
        timeZone:
          type: string
          maxLength: 100
          pattern: '^[A-Za-z0-9_+.-]+(?:/[A-Za-z0-9_+.-]+)*$'
        theme:
          type: string
          enum: [light, dark]
        pathname:
          type: string
          pattern: '^/$|^/[a-z][a-z-]{0,39}$'
        area:
          $ref: "#/components/schemas/BugReportArea"
        roles:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            enum: [Admin, Editor, Viewer, Messe]
        errors:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/BugReportClientError"
    BugReportServerDiagnostics:
      type: object
      additionalProperties: false
      required:
        [railkeeperVersion, deploymentType, goVersion, operatingSystem, architecture, schemaVersion,
         enabledDigitalProviderTypes]
      properties:
        collectedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
          minimum: 0
        cpuCount:
          type: integer
          minimum: 1
        goroutines:
          type: integer
          minimum: 1
        heapBytes:
          type: integer
          minimum: 0
        runtimeBytes:
          type: integer
          minimum: 0
        sqliteVersion:
          type: string
        databaseBytes:
          type: integer
          minimum: 0
        journalMode:
          type: string
        railkeeperVersion:
          type: string
        deploymentType:
          type: string
          enum: [windows-portable, container, native]
        goVersion:
          type: string
        operatingSystem:
          type: string
        architecture:
          type: string
        schemaVersion:
          type: integer
          minimum: 0
        enabledDigitalProviderTypes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ecos, z21, intellibox3, cs3]
    BugReportCapability:
      type: object
      additionalProperties: false
      required:
        [enabled, screenshotAvailable, fallbackUrl, maxScreenshotBytes, acceptedScreenshotTypes,
         includedDiagnosticCategories, excludedDiagnosticCategories, contactAvailable]
      properties:
        enabled:
          type: boolean
        screenshotAvailable:
          type: boolean
        fallbackUrl:
          type: string
          format: uri
        maxScreenshotBytes:
          type: integer
          const: 5242880
        acceptedScreenshotTypes:
          type: array
          items:
            type: string
            enum: [image/png, image/jpeg, image/webp]
        includedDiagnosticCategories:
          type: array
          items:
            type: string
        excludedDiagnosticCategories:
          type: array
          items:
            type: string
        contactAvailable:
          type: boolean
        serverDiagnostics:
          $ref: "#/components/schemas/BugReportServerDiagnostics"
    BugReportSubmissionResult:
      type: object
      additionalProperties: false
      required: [reportId, issueNumber, issueUrl, status, warning]
      properties:
        reportId:
          type: string
          format: uuid
        issueNumber:
          type: integer
          minimum: 1
        issueUrl:
          type: string
          format: uri
        status:
          type: string
          enum: [complete, partial]
        warning:
          type: string
paths:
  /setup/status:
    get:
      tags: [Setup]
      security: []
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /setup/admin:
    post:
      tags: [Setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminRequest"
      responses:
        "201":
          description: Admin user created
        "400":
          description: Weak input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Missing, incorrect or consumed local setup code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Setup already completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/session:
    get:
      tags: [Auth]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/login:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: IP or account login budget exhausted, or password verification is busy
          headers:
            Retry-After:
              description: Suggested delay in seconds; 1 for busy password work, 300 for the login attempt window.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/logout:
    post:
      tags: [Auth]
      responses:
        "204":
          description: Logged out
  /auth/password:
    put:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and other user sessions revoked
        "400":
          description: Weak password or invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Current password invalid or not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/two-factor:
    get:
      tags: [Auth]
      responses:
        "200":
          description: Current user's two-factor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/two-factor/setup:
    post:
      tags: [Auth]
      responses:
        "200":
          description: Two-factor setup secret generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/two-factor/enable:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorEnableRequest"
      responses:
        "200":
          description: Two-factor authentication enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatus"
        "401":
          description: Invalid two-factor code or not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/two-factor/disable:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorDisableRequest"
      responses:
        "204":
          description: Two-factor authentication disabled and other sessions revoked
        "401":
          description: Invalid password/code or not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /profile/settings:
    get:
      tags: [Auth]
      responses:
        "200":
          description: Current user's profile settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPayload"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPayload"
      responses:
        "200":
          description: Updated profile settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPayload"
        "400":
          description: Invalid settings payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /version:
    get:
      tags: [System]
      parameters:
        - name: check
          in: query
          schema:
            type: boolean
            default: false
        - name: prerelease
          in: query
