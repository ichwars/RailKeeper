  /vehicles/{id}/cv-values/import:
    post:
      tags: [Vehicles]
      summary: Import a reviewed selection of CV values atomically
      description: Requires Editor or Admin and CSRF. Upserts by vehicle, exact decoder profile, CV number and index pair. Duplicate input keys, unknown field names, missing/null values and foreign source attachments are rejected. Optional expectedRevision on each value pins an observed row or confirms absence with an empty string. All selected values and value histories commit together, or the entire import rolls back. Business-data limit remains 8 MiB; bounded overhead for up to 10000 comparison revisions is allowed separately. This stores inventory data and never writes to a decoder.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    $ref: "#/components/schemas/VehicleCVValueInput"
      responses:
        "200":
          description: All selected values were imported
          content:
            application/json:
              schema:
                type: object
                required: [imported]
                properties:
                  imported:
                    type: integer
        "400":
          description: Invalid JSON, invalid values/index pair, duplicate identity, foreign source file or exceeded limits
        "403":
          description: Role or CSRF check failed
        "404":
          description: Vehicle not found
        "409":
          description: An optional expected revision is stale; no values or histories changed
        "500":
          description: Import failed and all changes rolled back
  /vehicles/{id}/cv-values/changes:
    post:
      tags: [Vehicles]
      summary: Save a bounded manual CV draft atomically
      description: Editor or Admin and CSRF required. Maximum 500 explicit changes and 2 MiB. Exact profile, CV number and nullable index pair identify a CV. Revisions and source ownership are checked inside the transaction; a stale revision, identity collision or invalid row rolls back every value and history change. New rows are create-only, so retrying an acknowledged or unacknowledged draft cannot create duplicate identities. No physical decoder is written.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VehicleCVChangesInput'}
      responses:
        "200":
          description: Every requested change was saved
          content:
            application/json:
              schema:
                type: object
                required: [changed]
                properties:
                  changed: {type: integer, minimum: 1, maximum: 500}
        "400":
          description: Invalid draft, unknown fields, missing values/revision, foreign source, incomplete index pair or exceeded limits
        "403":
          description: Role or CSRF check failed
        "404":
          description: Vehicle not found
        "409":
          description: Stale or missing CV revision, or target identity already occupied; no changes saved
        "500":
          description: Saving failed; every change was rolled back
  /vehicles/{id}/cv-values/{cvValueID}:
    put:
      tags: [Vehicles]
      summary: Update a CV value
      description: JSON working-group fields select the destination. Optional query comparisons identify the original row's group and are required when moving a scoped row to another group. All three query fields must be present together, and the query expectedRevision must equal the JSON row revision. Legacy unscoped requests retain their behavior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleCVValueInput"
      parameters:
        - name: expectedRevision
          in: query
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
        - name: workspaceId
          in: query
          description: Original working group, distinct from the destination in JSON.
          schema: {type: string, minLength: 1}
        - name: expectedWorkspaceRevision
          in: query
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cvValueID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CV value updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleCVValue"
        "400":
          description: Invalid or incomplete original/destination working-group comparison
        "409":
          description: Target identity already exists or expected revision does not match
    delete:
      tags: [Vehicles]
      summary: Delete a CV value
      description: Optional working-group comparisons guard against a changed hardware binding. workspaceId and expectedWorkspaceRevision require each other and expectedRevision. All comparisons are checked in the deletion transaction. Omission retains the legacy contract.
      parameters:
        - name: expectedRevision
          in: query
          description: Optional revision guard. Omission retains the existing request behavior.
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
        - name: workspaceId
          in: query
          schema: {type: string, minLength: 1}
        - name: expectedWorkspaceRevision
          in: query
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cvValueID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: CV value deleted
        "400":
          description: Invalid or incomplete row/working-group comparison
        "409":
          description: Row or hardware binding is stale; the CV was not deleted
  /vehicles/{id}/cv-files:
    post:
      tags: [Vehicles]
      summary: Upload a decoder CV file for a vehicle
      description: Editor or Admin and CSRF required. Optional workspaceId and expectedWorkspaceRevision retain the exact selected group and reject a changed physical binding. Without a scope, existing profile/metadata inference remains unchanged. A selected scope overrides filename-derived profile suggestions.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              dependentRequired:
                workspaceId: [expectedWorkspaceRevision]
                expectedWorkspaceRevision: [workspaceId]
              properties:
                file: {type: string, format: binary}
                decoderProfile: {type: string}
                description: {type: string}
                workspaceId: {type: string, minLength: 1}
                expectedWorkspaceRevision: {type: string, pattern: '^[0-9a-f]{64}$'}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: CV file uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleCVFile"
        "400": {description: Invalid file, working group or profile}
        "403": {description: Editor or Admin and CSRF required}
        "404": {description: Vehicle not found}
        "409": {description: Working group binding changed before confirmation}
  /vehicles/{id}/cv-files/{cvFileID}:
    delete:
      tags: [Vehicles]
      summary: Delete a decoder CV file
      description: Optional workspaceId and expectedWorkspaceRevision require each other and expectedRevision. The file must belong to that exact working group. Its revision and hardware binding are checked in the same transaction before deletion. Omission retains legacy behavior.
      parameters:
        - name: expectedRevision
          in: query
          required: false
          schema: {type: string, pattern: "^[0-9a-f]{64}$"}
        - name: workspaceId
          in: query
          schema: {type: string, minLength: 1}
        - name: expectedWorkspaceRevision
          in: query
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cvFileID
          in: path
          required: true
          schema:
            type: string
      responses:
        "400":
          description: Invalid or incomplete file/working-group comparison
        "409":
          description: The file, source references or hardware binding changed; nothing was deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Problem"}
        "204":
          description: CV file deleted
  /vehicles/{id}/cv-files/{cvFileID}/download:
    get:
      tags: [Vehicles]
      summary: Download a decoder CV file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cvFileID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CV file
