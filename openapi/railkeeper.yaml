      tags: [Backup]
      summary: Export a local RailKeeper backup
      responses:
        "200":
          description: Backup JSON containing app data and upload files. Local users, sessions, rate limits, audit logs, password hashes, app settings and user settings are excluded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupDocument"
        "403":
          description: Admin role required
          content:
            application/json:
