    get:
      tags: [BugReports]
      summary: Read the safe in-app bug-reporting capability and diagnostic scope
      parameters:
        - in: query
          name: diagnostics
          schema:
            type: boolean
            default: false
          description: Collect fresh diagnostics only when explicitly requested. Otherwise serverDiagnostics is omitted.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Capability is returned even when direct reporting is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugReportCapability"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Explicitly requested diagnostics could not be collected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /bug-reports:
    post:
      tags: [BugReports]
      summary: Create or continue an idempotent in-app bug report
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [reportId, area, description]
              properties:
                reportId:
                  type: string
                  format: uuid
                area:
                  $ref: "#/components/schemas/BugReportArea"
                description:
                  type: string
                  minLength: 20
                  maxLength: 10000
                expectedBehavior:
                  type: string
                  maxLength: 5000
                reproductionSteps:
                  type: string
                  maxLength: 10000
                email:
                  type: string
                  format: email
                  maxLength: 254
                includeDiagnostics:
                  type: boolean
                  default: true
                  description: When false, the server skips collection and discards supplied clientDiagnostics.
                clientDiagnostics:
                  description: Required only when includeDiagnostics is true; ignored otherwise.
                  type: string
                  contentMediaType: application/json
                  contentSchema:
                    $ref: "#/components/schemas/BugReportClientDiagnostics"
                screenshotConsent:
                  type: boolean
                  description: Required and true when screenshot is present.
                screenshot:
                  type: string
                  format: binary
                  contentMediaType: image/png, image/jpeg, image/webp
                  maxLength: 5242880
      responses:
        "201":
          description: First accepted submission, complete or partial after issue creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugReportSubmissionResult"
        "200":
          description: Idempotent retry, complete or partial after issue creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugReportSubmissionResult"
        "400":
          description: Invalid report or screenshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Invalid CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Submission ownership or state conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: Screenshot or multipart request exceeds the bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Five new report IDs per user and hour exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: GitHub issue creation is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Direct reporting is not configured or not healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
