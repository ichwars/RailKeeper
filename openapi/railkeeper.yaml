  /accessory-products:
    get:
      tags: [Accessories]
      summary: List, filter, and sort accessory articles with global metrics
      description: Viewer, Editor, or Admin role required. Messe is excluded.
      security:
        - sessionCookie: []
      parameters:
        - name: query
          in: query
          description: >-
            Optional free-text filter. When present, it must be supplied at most once. Its raw value
            must contain no more than 200 Unicode characters and must not contain control characters;
            after trimming, at least one character must remain.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: articleType
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AccessoryArticleType"
        - name: gauge
          in: query
          description: >-
            Repeatable gauge labels. Each raw label must contain no more than 128 Unicode characters
            and must not contain control characters; after trimming, at least one character must remain.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 128
              description: >-
                A gauge label of 1 to 128 Unicode characters that must not contain control characters.
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [available, reserved, installed, maintenance_due, defective, archived]
        - name: manufacturer
          in: query
          description: >-
            Optional manufacturer filter. When present, it must be supplied at most once. Its raw value
            must contain no more than 200 Unicode characters and must not contain control characters;
            after trimming, at least one character must remain.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: locationId
          in: query
          description: >-
            Optional storage-location filter. When present, it must be supplied at most once. Its raw
            value must contain no more than 128 Unicode characters and must not contain control characters;
            after trimming, at least one character must remain.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [article, image, inventoryNumber, manufacturer, articleNumber, name,
               type, gauge, stock, storage, updatedAt]
            default: inventoryNumber
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Article list, global metrics, and filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessoryArticleListResult"
        "400":
          description: Invalid article filter or sort value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Viewer-equivalent role required; Messe is excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags: [Accessories]
      summary: Create an accessory product
      description: Editor or Admin role required. Confirmed duplicate article data is allowed.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessoryProductInput"
      responses:
        "201":
          description: Accessory product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessoryProduct"
        "400":
