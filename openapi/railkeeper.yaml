          description: Optional exact working group in this vehicle. The supplied profile must match its trimmed label; the persisted profile remains unchanged, including legacy whitespace. Scoped direct writes/imports also require expectedRevision; batches use the enclosing change revision.
        expectedWorkspaceRevision:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The selected workspace bindingRevision. Rejects a changed profile or hardware installation/state without treating ordinary CV edits in the same batch as binding changes.
    VehicleCVFields:
      type: object
      required: [cvNumber, value]
      description: A CV belongs to a vehicle and an exact trimmed decoder profile. Both index fields must be omitted/null for unindexed values, or supplied together for CVs 257-512. Zero is a valid index and differs from no index. Protocol is descriptive and is not part of the unique key.
      properties:
        cvNumber:
          type: integer
          minimum: 1
          maximum: 1024
        value:
          type: integer
          minimum: 0
          maximum: 255
        indexCV31:
          type: [integer, 'null']
          minimum: 0
          maximum: 255
        indexCV32:
          type: [integer, 'null']
          minimum: 0
          maximum: 255
        decoderProfile:
          type: string
          maxLength: 160
        protocol:
          type: string
          maxLength: 80
        category:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 1000
        sourceFileId:
          type: string
          maxLength: 80
          description: Must reference a decoder attachment of this same vehicle.
        sourceLine:
          type: [integer, 'null']
          minimum: 1
          maximum: 10000000
          description: Physical 1-based line in the imported source file, including header and blank lines.
        sourceExportedAt:
          type: string
          maxLength: 19
          pattern: '^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$'
          description: Valid local calendar timestamp from the source export (YYYY-MM-DDTHH:mm:ss). No timezone is inferred. Missing provenance is preserved on updates/imports.
    VehicleCVValue:
      allOf:
        - $ref: "#/components/schemas/VehicleCVFields"
        - type: object
          required: [id, vehicleId, createdAt, updatedAt]
          properties:
            id:
              type: string
            revision:
              type: string
              pattern: '^[0-9a-f]{64}$'
              readOnly: true
              description: Revision of the complete persisted CV record, including its exact profile/index identity and provenance.
            vehicleId:
              type: string
            createdAt:
              type: string
            updatedAt:
              type: string
            history:
              type: array
              items:
                $ref: "#/components/schemas/VehicleCVValueHistory"
    VehicleCVChange:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      description: Existing IDs require their original revision. A new row omits id and uses an empty revision. Delete requires an ID and no value. Optional outer workspaceId and expectedWorkspaceRevision compare the original row's exact group and hardware binding; they are invalid for new rows. Value fields select the destination group. Moving a scoped value to a different group also requires the original-group comparison. A value cannot move onto another stored identity; no existing row is silently replaced.
      properties:
        id: {type: string, maxLength: 80}
        expectedRevision: {type: string, pattern: '^([0-9a-f]{64})?$'}
        delete: {type: boolean}
        value: {$ref: '#/components/schemas/VehicleCVWriteFields'}
        workspaceId: {type: string, minLength: 1}
        expectedWorkspaceRevision: {type: string, pattern: '^[0-9a-f]{64}$'}
    VehicleCVChangesInput:
      type: object
      additionalProperties: false
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/VehicleCVChange'}
    DecoderInstance:
      type: object
      required: [id, label, manufacturer, model, serialNumber, notes, createdAt, updatedAt]
      properties:
        id: {type: string}
        label: {type: string}
        manufacturer: {type: string}
        model: {type: string}
        serialNumber: {type: string}
        notes: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DecoderInstallation:
      type: object
      required: [id, decoderId, vehicleId, vehicleReferenceId, vehicleName, vehicleInventoryNumber, state, installedAt, removedAt, notes, recordedAt, updatedAt]
      properties:
        id: {type: string}
        decoderId: {type: string}
        vehicleId: {type: [string, 'null']}
        vehicleReferenceId: {type: string}
        vehicleName: {type: string}
        vehicleInventoryNumber: {type: string}
        state: {type: string, enum: [installed, removed, unresolved]}
        installedAt: {type: [string, 'null'], format: date}
        removedAt: {type: [string, 'null'], format: date}
        notes: {type: string}
        recordedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DecoderCVWorkspace:
      type: object
      required: [id, vehicleId, profile, origin, installationId, createdAt, updatedAt, valueCount, sourceCount, contentRevision, bindingRevision]
      properties:
        id: {type: string}
        vehicleId: {type: string}
        profile: {type: string, description: Exact stored working label. Legacy whitespace is preserved.}
        origin: {type: string, enum: [legacy, manual]}
        installationId: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        valueCount: {type: integer, minimum: 0}
        sourceCount: {type: integer, minimum: 0}
        contentRevision: {type: string, pattern: '^[0-9a-f]{64}$'}
        bindingRevision: {type: string, pattern: '^[0-9a-f]{64}$', description: Exact working identity and physical installation/state. Stable across ordinary CV edits.}
    DecoderCVSnapshotSummary:
      type: object
      required: [id, workspaceId, vehicleReferenceId, vehicleName, vehicleInventoryNumber, profile, installationId, kind, scope, note, recordedAt, valueCount]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        vehicleReferenceId: {type: string}
        vehicleName: {type: string}
        vehicleInventoryNumber: {type: string}
        profile: {type: string}
        installationId: {type: [string, 'null']}
        kind: {type: string, enum: [legacy, manual, file_import, station_import, checkpoint]}
        scope: {type: string, enum: [partial_working_state]}
        note: {type: string}
        recordedAt: {type: string, format: date-time}
        valueCount: {type: integer, minimum: 0}
    DecoderConfigurationContext:
      type: object
      required: [vehicleId, vehicleName, inventoryNumber, instances, installations, workspaces, snapshots, revision]
      properties:
        vehicleId: {type: string}
        vehicleName: {type: string}
        inventoryNumber: {type: string}
        instances:
          type: array
          description: Known physical decoder inventory, including available instances and instances installed in other vehicles.
          items: {$ref: '#/components/schemas/DecoderInstance'}
        installations:
          type: array
          description: Installation episodes across the inventory. Use vehicleId and state to identify the current vehicle's active installations.
          items: {$ref: '#/components/schemas/DecoderInstallation'}
        workspaces:
          type: array
          items: {$ref: '#/components/schemas/DecoderCVWorkspace'}
        snapshots:
          type: array
          items: {$ref: '#/components/schemas/DecoderCVSnapshotSummary'}
        revision: {type: string, pattern: '^[0-9a-f]{64}$'}
    DecoderRecordedCVValue:
      type: object
      description: Historical evidence, including original raw profiles and unknown integer values. These fields are not validated programming commands. Missing index pages differ from page 0/0.
      required: [id, vehicleId, cvNumber, value, createdAt, updatedAt]
      properties:
        id: {type: string}
        vehicleId: {type: string}
        cvNumber: {type: integer}
        value: {type: integer}
        indexCV31: {type: [integer, 'null']}
        indexCV32: {type: [integer, 'null']}
        decoderProfile: {type: string}
        description: {type: string}
        category: {type: string}
        protocol: {type: string}
        sourceFileId: {type: string}
        sourceLine: {type: [integer, 'null']}
        sourceExportedAt: {type: string}
        createdAt: {type: string}
        updatedAt: {type: string}
        revision: {type: string, readOnly: true}
        history:
          type: array
          items: {$ref: '#/components/schemas/VehicleCVValueHistory'}
    DecoderCVSnapshotPayload:
      type: object
      required: [values]
      properties:
        values:
          type: array
          items: {$ref: '#/components/schemas/DecoderRecordedCVValue'}
    DecoderSnapshotHardware:
      type: object
      required: [decoderId, decoderLabel, manufacturer, model, serialNumber, installationId, installationState, installedAt, removedAt]
      properties:
        decoderId: {type: string}
        decoderLabel: {type: string}
        manufacturer: {type: string}
        model: {type: string}
        serialNumber: {type: string}
        installationId: {type: string}
        installationState: {type: string, enum: [installed, removed, unresolved]}
        installedAt: {type: [string, 'null'], format: date}
        removedAt: {type: [string, 'null'], format: date}
    DecoderCVSnapshotSource:
      type: object
      required: [sourceFileId, metadata, contentState]
      properties:
        sourceFileId: {type: string}
        metadata: {$ref: '#/components/schemas/VehicleCVFile'}
        contentState: {type: string, enum: [stored, unavailable]}
    DecoderCVSnapshot:
      type: object
      allOf:
        - $ref: '#/components/schemas/DecoderCVSnapshotSummary'
      required: [payload, hardware, sources]
      properties:
        payload: {$ref: '#/components/schemas/DecoderCVSnapshotPayload'}
        hardware:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/DecoderSnapshotHardware'}
        sources:
          type: array
          items: {$ref: '#/components/schemas/DecoderCVSnapshotSource'}
    DecoderInstanceInput:
      type: object
      additionalProperties: false
      required: [id, expectedRevision, label, manufacturer, model, serialNumber, notes]
      description: Complete explicit instance edit. New instances require a new 32-character lowercase hexadecimal ID; updates retain the existing ID. Text limits apply to UTF-8 bytes.
      properties:
        id: {type: string, minLength: 1}
        expectedRevision: {type: string, pattern: '^[0-9a-f]{64}$'}
        label: {type: string, minLength: 1, maxLength: 160}
        manufacturer: {type: string, maxLength: 160}
        model: {type: string, maxLength: 160}
        serialNumber: {type: string, maxLength: 160}
        notes: {type: string, maxLength: 4000}
    DecoderInstallationInput:
      type: object
      additionalProperties: false
      required: [id, expectedRevision, decoderId, installedAt, notes]
      properties:
        id: {type: string, pattern: '^[0-9a-f]{32}$'}
        expectedRevision: {type: string, pattern: '^[0-9a-f]{64}$'}
        decoderId: {type: string, minLength: 1}
        installedAt: {type: [string, 'null'], format: date}
        notes: {type: string, maxLength: 4000}
    DecoderRemovalInput:
      type: object
      additionalProperties: false
      required: [expectedRevision, removedAt, note]
      properties:
        expectedRevision: {type: string, pattern: '^[0-9a-f]{64}$'}
        removedAt: {type: [string, 'null'], format: date}
        note: {type: string, maxLength: 2000, description: Appended to existing episode notes.}
    DecoderInstallationDatesInput:
      type: object
      additionalProperties: false
      required: [expectedRevision, installedAt, removedAt]
      properties:
        expectedRevision: {type: string, pattern: '^[0-9a-f]{64}$'}
        installedAt: {type: [string, 'null'], format: date}
        removedAt: {type: [string, 'null'], format: date}
    DecoderCVWorkspaceInput:
      type: object
      additionalProperties: false
      required: [id, expectedRevision, profile]
      properties:
        id: {type: string, pattern: '^[0-9a-f]{32}$'}
        expectedRevision: {type: string, pattern: '^[0-9a-f]{64}$'}
        profile: {type: string, minLength: 1, maxLength: 160, description: New trimmed working label with at most 160 UTF-8 bytes. Does not identify hardware.}
    DecoderCVCheckpointInput:
      type: object
      additionalProperties: false
      required: [id, expectedRevision, note]
      properties:
        id: {type: string, pattern: '^[0-9a-f]{32}$'}
        expectedRevision: {type: string, pattern: '^[0-9a-f]{64}$'}
        note: {type: string, maxLength: 2000}
    DecoderCVAssignmentInput:
      type: object
      additionalProperties: false
      required: [expectedRevision, installationId, snapshotId]
      properties:
        expectedRevision: {type: string, pattern: '^[0-9a-f]{64}$'}
        installationId: {type: [string, 'null'], description: Active installation in this vehicle, or explicit null to clear the current association.}
        snapshotId: {type: string, pattern: '^[0-9a-f]{32}$', description: Stable identity of the checkpoint retained before changing the association.}
    DecoderText:
      type: object
      required: [de, en]
      properties:
        de: {type: string}
        en: {type: string}
    DecoderSource:
      type: object
      required: [title, url, version, scope]
      properties:
        title: {type: string}
        url: {type: string, format: uri, pattern: '^https://'}
        version: {type: string}
        scope: {type: string}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: Fingerprint of the reviewed source document when available.}
        retrievedAt: {type: string, format: date}
    DecoderDefinition:
      type: object
      required: [cv, name, help, topic, minimum, maximum]
      properties:
        cv: {type: integer, minimum: 1, maximum: 1024}
        cvEnd: {type: integer, minimum: 1, maximum: 1024}
        cvStride: {type: integer, minimum: 1, maximum: 256, description: 'Optional step within the CV range; addresses between steps are not covered.'}
        firmwareMin: {type: string, description: 'Minimum documented firmware for this definition. Known older firmware receives no interpretation from it.'}
        indexCV31: {type: integer, minimum: 0, maximum: 255}
        indexCV32: {type: integer, minimum: 0, maximum: 255}
        indexCV32End: {type: integer, minimum: 0, maximum: 255}
        name: {$ref: '#/components/schemas/DecoderText'}
        help: {$ref: '#/components/schemas/DecoderText'}
        topic: {type: string, enum: [address, motor, braking, outputs, communication]}
        minimum: {type: integer, minimum: 0, maximum: 255}
        maximum: {type: integer, minimum: 0, maximum: 255}
        reference:
          type: object
          required: [sourceIndex, location]
          description: Reviewed table or section within this profile's sources array.
          properties:
            sourceIndex: {type: integer, minimum: 0, maximum: 9}
            location: {type: string, minLength: 1, maxLength: 200}
        factoryDefault: {type: integer, minimum: 0, maximum: 255, description: 'Documented factory value, never a replacement for a missing reading. Absent for variable or unknown defaults.'}
        reserved: {type: boolean, description: 'Explicitly reserved in the cited source. Has no functional semantics, unit, default or access and does not count as an interpreted value.'}
        allowedValues:
          type: array
          maxItems: 256
          uniqueItems: true
          items: {type: integer, minimum: 0, maximum: 255}
          description: Optional finite set, for registers whose documented values are not a continuous range.
        access: {type: string, enum: [read-only, read-write, command], description: 'Documented register access; does not authorize hardware writes.'}
        unit: {$ref: '#/components/schemas/DecoderText'}
        bits:
          type: array
          maxItems: 8
          items:
            type: object
            required: [bit, name, off, on]
            properties:
              bit: {type: integer, minimum: 0, maximum: 7}
              name: {$ref: '#/components/schemas/DecoderText'}
              "off": {$ref: '#/components/schemas/DecoderText'}
              "on": {$ref: '#/components/schemas/DecoderText'}
    DecoderBitRule:
      type: object
      required: [cv, mask]
      properties:
        cv: {type: integer, minimum: 1, maximum: 1024}
        mask: {type: integer, minimum: 1, maximum: 255}
    DecoderLibraryProfile:
      type: object
      required: [id, name, nameEn, revision, protocol, kind, aliases, familyAliases, sources, definitions, active]
      description: Declarative local documentation, stored as decoder_profile master-data metadata. No hardware writes.
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,79}$'}
        name: {type: string}
        nameEn: {type: string}
        revision: {type: string}
        protocol: {type: string, enum: [DCC]}
        kind: {type: string, enum: [standard, model]}
        manufacturerId: {type: integer, minimum: 0, maximum: 255}
        family: {type: string}
        model: {type: string}
        parentId: {type: string}
        firmwareMin: {type: string}
        aliases: {type: array, items: {type: string}}
        familyAliases: {type: array, items: {type: string}}
        sources: {type: array, items: {$ref: '#/components/schemas/DecoderSource'}}
        definitions: {type: array, items: {$ref: '#/components/schemas/DecoderDefinition'}}
        active: {type: boolean}
        rules:
          type: object
          properties:
            modelDefinitionsOnly: {type: boolean, description: 'For a matched compatible model, use only its own reviewed CV definitions. Undocumented addresses remain unknown instead of inheriting generic DCC meanings. Does not enable executable rules.'}
            piko56500: {type: boolean, description: 'Enables only reviewed PIKO56500 PluX22 rules: simple mapping conditional on CV96=1, exact output bank18/0, braking triggers and communication permissions. Conflicting firmware-dependent analog thresholds remain unknown. No function-key mode or inversion inference.'}
            roco10882: {type: boolean, description: 'Enables only the reviewed Roco 10882 (2012, technical manufacturer145) algorithm: model-limited shifted outputs, documented braking/analog conditions, RailCom permissions, dimming and selected speed characteristic. No ZIMO MN rules, key mode/inversion or metadata executable formula.'}
            uhlenbrock76420: {type: boolean, description: 'Enables only the reviewed manufacturer85 IntelliDrive 76420 evaluation: uniform function masks, analog and braking conditions, timed outputs and raw speed parameters. No RailCom, ABC, key mode/inversion or executable metadata formula is inferred.'}
            kuehnN45: {type: boolean, description: 'Enables the reviewed manufacturer157 N45 algorithm, exact family/model N45 with ABC CV27/mask3: shifted output masks, SUSI gating, decimal effects, motor and DC braking parameters. No key mode/inversion or executable metadata formula.'}
            esuStandard: {type: boolean, description: 'Reviewed ESU LokPilot Standard mapping, including directional registers, shunting and momentum. No LokPilot 5 rules, missing-register defaults or key-mode inference.'}
            lenzStandardV2: {type: boolean, description: 'Enables the reviewed STANDARD+ V2 algorithm for manufacturer99, exact family/model STANDARD+ V2: CV51 braking, motor configuration, RailCom channels, output masks and smoothed characteristic. Missing values stay unknown; no metadata-supplied formula or hardware write.'}
            zimoMN: {type: boolean, description: 'Enables the reviewed MN180N18 summary algorithm for source scope SW5.29: consist extension, function permissions, stopping parameters and smoothed speed characteristic. No executable formula is accepted in metadata.'}
            motorCurveCV: {type: integer, minimum: 1, maximum: 256, description: 'Documented model-specific motor characteristic register. Disables generic DCC curve plotting; no characteristic points are inferred from this scalar value.'}
            abc: {$ref: '#/components/schemas/DecoderBitRule'}
            dcAnalog: {$ref: '#/components/schemas/DecoderBitRule'}
            constantBrake:
              type: object
              required: [forwardCV, reverseCV]
              properties:
                forwardCV: {type: integer, minimum: 1, maximum: 1024}
                reverseCV: {type: integer, minimum: 1, maximum: 1024}
                enableCV: {type: integer, minimum: 1, maximum: 1024, description: 'Optional register that must be positive to enable constant braking.'}
        mapping:
          type: object
          description: Reviewed ESU layouts only. V5 defaults to 72 rows on condition pages 3–7 and action pages 8–12. esu-v4 uses 32 rows with both blocks on pages 2–3.
          required: [rows, rowsPerPage, stride, startCV, indexCV31, conditionPage, actionPage]
          oneOf:
            - not: {required: [format]}
              properties:
                rows: {const: 72}
                conditionPage: {const: 3}
                actionPage: {const: 8}
            - required: [format]
              properties:
                format: {const: esu-v4}
                rows: {const: 32}
                conditionPage: {const: 2}
                actionPage: {const: 2}
          properties:
            format: {type: string, enum: [esu-v4]}
            rows: {type: integer, enum: [32, 72]}
            rowsPerPage: {type: integer, const: 16}
            stride: {type: integer, const: 16}
            startCV: {type: integer, const: 257}
            indexCV31: {type: integer, const: 16}
            conditionPage: {type: integer, enum: [2, 3]}
            actionPage: {type: integer, enum: [2, 8]}
    DecoderLibrary:
      type: object
      required: [schemaVersion, profiles]
      properties:
        schemaVersion: {type: integer, const: 1}
        profiles: {type: array, items: {$ref: '#/components/schemas/DecoderLibraryProfile'}}
        inventory: {$ref: '#/components/schemas/DecoderInventory'}
        referenceCoverage:
          type: array
          items: {$ref: '#/components/schemas/DecoderReferenceCoverage'}
    DecoderReferenceCoverage:
      type: object
      required: [id, modelIds, status, rowCount, active]
      properties:
        id: {type: string}
        modelIds: {type: array, minItems: 1, maxItems: 2048, uniqueItems: true, items: {type: string}}
        status: {type: string, enum: [table, partial, unavailable]}
        rowCount: {type: integer, minimum: 0, maximum: 1024}
        active: {type: boolean}
    DecoderCVReference:
      type: object
      description: Documentation-only manufacturer CV facts stored as decoder_reference master data. Unknown index pages remain explicit. Does not enable executable interpretation or decoder identification.
      required: [id, revision, modelIds, title, note, status, sources, rows, active]
      properties:
        id: {type: string}
        revision: {type: string}
        modelIds: {type: array, minItems: 1, maxItems: 2048, uniqueItems: true, items: {type: string}}
        title: {$ref: '#/components/schemas/DecoderText'}
        note: {$ref: '#/components/schemas/DecoderText'}
        status: {type: string, enum: [table, partial, unavailable]}
        sources: {type: array, minItems: 1, maxItems: 10, items: {$ref: '#/components/schemas/DecoderSource'}}
        active: {type: boolean}
        rows: {type: array, maxItems: 1024, items: {$ref: '#/components/schemas/DecoderCVReferenceRow'}}
    DecoderCVReferenceRow:
      type: object
      required: [cv, label, page, sourceIndex, indexScope, applicability]
      properties:
        cv: {type: integer, minimum: 1, maximum: 1024}
        cvEnd: {type: integer, minimum: 1, maximum: 1024}
        label: {type: string, maxLength: 200}
        valueRange: {type: string, maxLength: 160}
        factoryValue: {type: string, maxLength: 160}
        page: {type: integer, minimum: 0, maximum: 1000, description: One-based PDF page, or zero for nonpaged source evidence.}
        sourceIndex: {type: integer, minimum: 0, maximum: 9}
        indexScope: {type: string, enum: [base, indexed, unspecified]}
        indexCV31: {type: integer, minimum: 0, maximum: 255}
        indexCV32: {type: integer, minimum: 0, maximum: 255}
        applicability: {type: string, enum: [model, manual]}
    DecoderInventory:
      type: object
      description: Curated model directory stored as decoder_catalog/library master-data metadata. A model entry alone never enables manufacturer CV interpretation.
      required: [revision, reviewedAt, manufacturers, families, models]
      properties:
        revision: {type: string}
        reviewedAt: {type: string, format: date}
        manufacturers:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: '#/components/schemas/DecoderManufacturer'}
        families:
          type: array
          minItems: 1
          maxItems: 512
          items: {$ref: '#/components/schemas/DecoderFamily'}
        models:
          type: array
          minItems: 1
          maxItems: 2048
          items: {$ref: '#/components/schemas/DecoderModel'}
    DecoderManufacturer:
      type: object
      required: [id, name, cv8, website, source]
      properties:
        id: {type: string}
        name: {type: string}
        cv8: {type: integer, minimum: 0, maximum: 255}
        website: {type: string, format: uri, pattern: '^https://'}
        source: {$ref: '#/components/schemas/DecoderSource'}
        coverage: {$ref: '#/components/schemas/DecoderText'}
    DecoderFamily:
      type: object
      required: [id, manufacturerId, name, sources, notes, identification]
      properties:
        id: {type: string}
        manufacturerId: {type: string}
        name: {type: string}
        sources: {type: array, items: {$ref: '#/components/schemas/DecoderSource'}}
        notes: {$ref: '#/components/schemas/DecoderText'}
        identification: {$ref: '#/components/schemas/DecoderText'}
    DecoderModel:
      type: object
      required: [id, familyId, name, kind, interfaces, articleNumbers]
      properties:
        id: {type: string}
        familyId: {type: string}
        name: {type: string}
        kind: {type: string, enum: [motor, sound, function]}
        interfaces: {type: array, items: {type: string}}
        articleNumbers: {type: array, items: {type: string}}
        profileId: {type: string, description: 'Optional link to a reviewed interpretation profile, never inferred from CV8 alone.'}
        documentationProfileId: {type: string, description: 'Reference-only manual for a branded product. Does not enable model identification or transfer the retail brand CV8.'}
        notes: {$ref: '#/components/schemas/DecoderText'}
        sources: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/DecoderSource'}}
        identification: {$ref: '#/components/schemas/DecoderIdentityRule'}
        variants:
          type: array
          maxItems: 64
          description: Explicit source-backed article/connection pairs; never inferred from parallel summary arrays.
          items: {$ref: '#/components/schemas/DecoderVariant'}
        brandOnly:
          type: boolean
          description: Retail brand entry with unconfirmed technical CV8. Cannot link to an interpretation profile or identity rule.
        documentStatus: {type: string, enum: [historical, announced]}
    DecoderVariant:
      type: object
      required: [articleNumber, interface, source]
      properties:
        articleNumber: {type: string}
        interface: {type: string}
        source: {$ref: '#/components/schemas/DecoderSource'}
    DecoderIdentityRule:
      type: object
      description: Requires matching unindexed CV8 in addition to the documented type register. Family scope never confirms an interface variant.
      required: [cv, values, scope, name]
      properties:
        cv: {type: integer, minimum: 1, maximum: 1024, not: {enum: [8, 31, 32]}}
        values: {type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: {type: integer, minimum: 0, maximum: 255}}
