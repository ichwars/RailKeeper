          format: double
          minimum: 0
        clearanceLimitMm:
          type: number
          format: double
          exclusiveMinimum: 0
        intersectionXMm:
          type: number
          format: double
        intersectionYMm:
          type: number
          format: double
        radiusMm:
          type: number
          format: double
          exclusiveMinimum: 0
        radiusLimitMm:
          type: number
          format: double
          exclusiveMinimum: 0
    TrackBOMLine:
      type: object
      required: [geometryId, libraryId, articleNumber, name, quantity]
      properties:
        geometryId:
          type: string
        libraryId:
          type: string
        articleNumber:
          type: string
        name:
          type: string
        quantity:
          type: integer
          minimum: 0
    TrackGrade:
      type: object
      required: [objectId, elevationStartMm, elevationEndMm, lengthMm, gradePercent]
      properties:
        objectId:
          type: string
        elevationStartMm:
          type: number
          format: double
        elevationEndMm:
          type: number
          format: double
        lengthMm:
          type: number
          format: double
          minimum: 0
        gradePercent:
          type: number
          format: double
    TrackMaterialStatus:
      type: object
      required:
        - geometryId
        - manufacturer
        - articleNumber
        - name
        - requiredQuantity
        - productIds
        - inventoryNumbers
        - physicalQuantity
        - reservedQuantity
        - availableQuantity
        - missingQuantity
      properties:
        geometryId:
          type: string
        manufacturer:
          type: string
        articleNumber:
          type: string
        name:
          type: string
        requiredQuantity:
          type: integer
          minimum: 0
        productIds:
          type: array
          items:
            type: string
        inventoryNumbers:
          type: array
          items:
            type: string
        physicalQuantity:
          type: integer
          minimum: 0
        reservedQuantity:
          type: integer
          minimum: 0
        availableQuantity:
          type: integer
          minimum: 0
        missingQuantity:
          type: integer
          minimum: 0
    TrackPlanAnalysis:
      type: object
      required: [revisionId, status, connections, issues, bom, grades, materials, reservations]
      properties:
        revisionId:
          type: string
        status:
          type: string
          enum: [draft, review, published, archived]
        connections:
          type: array
          items:
            $ref: "#/components/schemas/TrackPlanConnection"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/TrackPlanIssue"
        bom:
          type: array
          items:
            $ref: "#/components/schemas/TrackBOMLine"
        grades:
          type: array
          items:
            $ref: "#/components/schemas/TrackGrade"
        materials:
          type: array
          items:
            $ref: "#/components/schemas/TrackMaterialStatus"
        reservations:
          type: array
          items:
            $ref: "#/components/schemas/TrackPlanObjectReservation"
    TrackPlanObjectChange:
      type: object
      required: [type, lineageId]
      properties:
        type:
          type: string
          enum: [added, removed, changed]
        lineageId:
          type: string
        before:
          $ref: "#/components/schemas/PlanTrackObject"
        after:
          $ref: "#/components/schemas/PlanTrackObject"
    PlanFreeObjectChange:
      type: object
      required: [type, lineageId]
      properties:
        type:
          type: string
          enum: [added, removed, changed]
        lineageId:
          type: string
        before:
          $ref: "#/components/schemas/PlanFreeObject"
        after:
          $ref: "#/components/schemas/PlanFreeObject"
    TrackPlanMaterialDelta:
      type: object
      required:
        [geometryId, libraryId, manufacturer, articleNumber, name, baseQuantity,
         currentQuantity, delta]
      properties:
        geometryId:
          type: string
        libraryId:
          type: string
        manufacturer:
          type: string
        articleNumber:
          type: string
        name:
          type: string
        baseQuantity:
          type: integer
        currentQuantity:
          type: integer
        delta:
          type: integer
    TrackPlanIssueChange:
      type: object
      required: [code, severity, lineageIds]
      properties:
        code:
          type: string
          enum: [open_end, incompatible_connection, overlap, broken_geometry, elevation_mismatch, grade_limit_exceeded, insufficient_clearance, flex_radius_below_limit]
        severity:
          type: string
          enum: [warning, error]
        lineageIds:
          type: array
          items:
            type: string
        portIds:
          type: array
          items:
            type: string
    TrackPlanIssueDiff:
      type: object
      required: [added, resolved]
      properties:
        added:
          type: array
          items:
            $ref: "#/components/schemas/TrackPlanIssueChange"
        resolved:
          type: array
          items:
            $ref: "#/components/schemas/TrackPlanIssueChange"
    TrackPlanAffectedConfiguration:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    TrackPlanChangePreview:
      type: object
      required:
        - revisionId
        - baseRevisionId
        - objectChanges
        - freeObjectChanges
        - materialDeltas
        - issues
        - affectedConfigurations
      properties:
        revisionId:
          type: string
        baseRevisionId:
          type: string
        objectChanges:
          type: array
          items:
            $ref: "#/components/schemas/TrackPlanObjectChange"
        freeObjectChanges:
          type: array
          items:
            $ref: "#/components/schemas/PlanFreeObjectChange"
        materialDeltas:
          type: array
          items:
            $ref: "#/components/schemas/TrackPlanMaterialDelta"
        issues:
          $ref: "#/components/schemas/TrackPlanIssueDiff"
        affectedConfigurations:
          type: array
          items:
            $ref: "#/components/schemas/TrackPlanAffectedConfiguration"
    TrackPlanReservationInput:
      type: object
      required: [trackObjectId, productId, locationId, expectedObjectVersion]
      properties:
        trackObjectId:
          type: string
        productId:
          type: string
        locationId:
          type: string
        assetId:
          type: string
        expectedObjectVersion:
          type: integer
          minimum: 1
    ReserveTrackPlanMaterialsInput:
      type: object
      required: [confirmed, items]
      properties:
        confirmed:
          type: boolean
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TrackPlanReservationInput"
    TrackPlanObjectReservation:
      type: object
      required: [trackObjectId, reservation]
      properties:
        trackObjectId:
          type: string
        reservation:
          $ref: "#/components/schemas/AccessoryReservation"
    TrackPlanReservationBatch:
      type: object
      required: [revisionId, reservations, materials]
      properties:
        revisionId:
          type: string
        reservations:
          type: array
          items:
            $ref: "#/components/schemas/TrackPlanObjectReservation"
        materials:
          type: array
          items:
            $ref: "#/components/schemas/TrackMaterialStatus"
    CreatePlanTrackObjectInput:
      type: object
      required: [geometryId, positionXMm, positionYMm, rotationDegrees, elevationStartMm, elevationEndMm]
      properties:
        geometryId:
          type: string
        positionXMm:
          type: number
          format: double
        positionYMm:
          type: number
          format: double
        rotationDegrees:
          type: number
          format: double
        elevationStartMm:
          type: number
          format: double
        elevationEndMm:
          type: number
          format: double
        flexPath:
          $ref: "#/components/schemas/FlexTrackPath"
        transitionPath:
          $ref: "#/components/schemas/TransitionCurvePath"
    CreateFreePlanObjectInput:
      type: object
      required: [name, category, positionXMm, positionYMm, rotationDegrees, shape]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        category:
          type: string
          enum: [structure, platform, scenery, annotation]
        positionXMm:
          type: number
          format: double
        positionYMm:
          type: number
          format: double
        rotationDegrees:
          type: number
          format: double
        shape:
          $ref: "#/components/schemas/FreePlanObjectShape"
    UpdateFreePlanObjectInput:
      allOf:
        - $ref: "#/components/schemas/CreateFreePlanObjectInput"
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion:
              type: integer
              minimum: 1
    UpdatePlanTrackObjectInput:
      type: object
      required: [positionXMm, positionYMm, rotationDegrees, elevationStartMm, elevationEndMm, expectedVersion]
      properties:
        positionXMm:
          type: number
          format: double
        positionYMm:
          type: number
          format: double
        rotationDegrees:
          type: number
          format: double
        elevationStartMm:
          type: number
          format: double
        elevationEndMm:
          type: number
          format: double
        flexPath:
          $ref: "#/components/schemas/FlexTrackPath"
        transitionPath:
          $ref: "#/components/schemas/TransitionCurvePath"
        expectedVersion:
          type: integer
          minimum: 1
    FlexTrackPreviewInput:
      type: object
      required: [endXMm, endYMm, endDirectionDegrees, expectedVersion]
      properties:
        endXMm:
          type: number
          format: double
        endYMm:
          type: number
          format: double
        endDirectionDegrees:
          type: number
          format: double
        expectedVersion:
          type: integer
          minimum: 1
    FlexTrackPreview:
      type: object
      required: [path, effectiveGeometry, effectiveLengthMm, radiusLimitMm, lengthExceeded, radiusBelowLimit, applicable]
      properties:
        path:
          $ref: "#/components/schemas/FlexTrackPath"
        effectiveGeometry:
          $ref: "#/components/schemas/TrackGeometry"
        effectiveLengthMm:
          type: number
          format: double
          minimum: 0
        effectiveMinimumRadiusMm:
          type: [number, "null"]
          format: double
          exclusiveMinimum: 0
        radiusLimitMm:
          type: number
          format: double
          exclusiveMinimum: 0
        lengthExceeded:
          type: boolean
        radiusBelowLimit:
          type: boolean
        applicable:
          type: boolean
    TransitionCurvePreviewInput:
      type: object
      required: [lengthMm, endRadiusMm, direction, expectedVersion]
      properties:
        lengthMm:
          type: number
          format: double
          exclusiveMinimum: 0
        endRadiusMm:
          type: number
          format: double
          exclusiveMinimum: 0
        direction:
          type: string
          enum: [left, right]
        expectedVersion:
          type: integer
          minimum: 1
    TransitionCurvePreview:
      type: object
      required: [path, effectiveGeometry, effectiveLengthMm, radiusLimitMm, lengthExceeded, radiusBelowLimit, applicable]
      properties:
        path:
          $ref: "#/components/schemas/TransitionCurvePath"
        effectiveGeometry:
          $ref: "#/components/schemas/TrackGeometry"
        effectiveLengthMm:
          type: number
          format: double
          exclusiveMinimum: 0
        effectiveMinimumRadiusMm:
          type: [number, "null"]
          format: double
          exclusiveMinimum: 0
        radiusLimitMm:
          type: number
          format: double
          exclusiveMinimum: 0
        lengthExceeded:
          type: boolean
        radiusBelowLimit:
          type: boolean
        applicable:
          type: boolean
    ExhibitionStatus:
      type: string
      enum: [draft, open, locked, running, completed, archived]
    ExhibitionEntryStatus:
      type: string
      enum: [ready, addressConflict, missing, check, unavailable]
    ExhibitionList:
      type: object
      required: [id, designation, date, endDate, status, revision, locked, entryCount, createdAt, updatedAt]
      properties:
        id:
          type: string
        designation:
          type: string
        date:
          type: string
          format: date
        endDate:
          type: string
          format: date
        location:
          type: string
        description:
          type: string
        organizationNotes:
          type: string
        status:
          $ref: "#/components/schemas/ExhibitionStatus"
        revision:
          type: integer
          minimum: 1
        locked:
          type: boolean
        lockReason:
          type: string
        lockedAt:
          type: string
        completedAt:
          type: string
        archivedAt:
          type: string
        entryCount:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ExhibitionEntry"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExhibitionListInput:
      type: object
      required: [designation, date]
      properties:
        designation:
          type: string
        date:
          type: string
          format: date
        endDate:
          type: string
          format: date
        location:
          type: string
        description:
          type: string
        organizationNotes:
          type: string
        status:
          $ref: "#/components/schemas/ExhibitionStatus"
        expectedRevision:
          type: integer
          minimum: 1
    ExhibitionLockInput:
      type: object
      required: [locked]
      properties:
        locked:
          type: boolean
    ExhibitionEntry:
      type: object
      required: [id, listId, owner, locomotiveName, dtDecoder, sortOrder, availability, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
        listId:
          type: string
        owner:
          type: string
        imageUrl:
          type: string
        locomotiveName:
          type: string
        dtDecoder:
          type: boolean
        decoderNumber:
          type: string
        interfaceName:
          type: string
        availability:
          type: string
          enum: [available, unavailable]
        revision:
          type: integer
          minimum: 1
        functionKeys:
          type: string
        notes:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExhibitionEntryInput:
      type: object
      required: [locomotiveName, dtDecoder]
      properties:
        owner:
          type: string
        imageUrl:
          type: string
        locomotiveName:
          type: string
        dtDecoder:
          type: boolean
        decoderNumber:
          type: string
        interfaceName:
          type: string
        availability:
          type: string
          enum: [available, unavailable]
        expectedRevision:
          type: integer
          minimum: 1
        functionKeys:
          type: string
        notes:
          type: string
        sortOrder:
          type: integer
    ExhibitionSummary:
      type: object
      required: [entryCount, ownerCount, conflictCount, readyCount]
      properties:
        entryCount: { type: integer }
        ownerCount: { type: integer }
        conflictCount: { type: integer }
        readyCount: { type: integer }
    ExhibitionReadiness:
      type: object
      required: [total, addressesChecked, functionsDocumented, imagesPresent, problems]
      properties:
        total: { type: integer }
        addressesChecked: { type: integer }
        functionsDocumented: { type: integer }
        imagesPresent: { type: integer }
        problems: { type: integer }
    ExhibitionConflict:
      type: object
      required: [id, kind, entryIds, excepted]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [address, missing, duplicateVehicle]
        entryIds:
          type: array
          items: { type: string }
        fields:
          type: array
          items: { type: string }
        interfaceName: { type: string }
        address: { type: string }
        dayScopes:
          type: array
          items: { type: string }
        excepted: { type: boolean }
        exceptionReason: { type: string }
    ExhibitionWorkspaceEntry:
      allOf:
        - $ref: "#/components/schemas/ExhibitionEntry"
        - type: object
          required: [status, conflictIds]
          properties:
            status:
              $ref: "#/components/schemas/ExhibitionEntryStatus"
            conflictIds:
              type: array
              items: { type: string }
    ExhibitionWorkspace:
      type: object
      required: [list, summary, readiness, entries, conflicts, dayScopes]
      properties:
        list: { $ref: "#/components/schemas/ExhibitionList" }
        summary: { $ref: "#/components/schemas/ExhibitionSummary" }
        readiness: { $ref: "#/components/schemas/ExhibitionReadiness" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/ExhibitionWorkspaceEntry" }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/ExhibitionConflict" }
        dayScopes:
          type: array
          items: { type: string }
    ExhibitionStatusInput:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/ExhibitionStatus" }
        expectedRevision: { type: integer, minimum: 1 }
        confirmConflicts: { type: boolean }
        reason: { type: string }
    ExhibitionConflictExceptionInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        expectedRevision: { type: integer, minimum: 1 }
paths:
  /setup/status:
    get:
      tags: [Setup]
      security: []
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /setup/admin:
    post:
      tags: [Setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminRequest"
      responses:
        "201":
          description: Admin user created
        "400":
          description: Weak input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Setup already completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/session:
    get:
      tags: [Auth]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/login:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/logout:
    post:
      tags: [Auth]
      responses:
        "204":
          description: Logged out
  /auth/password:
    put:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and other user sessions revoked
        "400":
          description: Weak password or invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Current password invalid or not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/two-factor:
    get:
      tags: [Auth]
      responses:
        "200":
          description: Current user's two-factor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/two-factor/setup:
    post:
      tags: [Auth]
      responses:
        "200":
          description: Two-factor setup secret generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/two-factor/enable:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorEnableRequest"
      responses:
        "200":
          description: Two-factor authentication enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatus"
        "401":
          description: Invalid two-factor code or not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/two-factor/disable:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorDisableRequest"
      responses:
        "204":
          description: Two-factor authentication disabled and other sessions revoked
        "401":
          description: Invalid password/code or not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /profile/settings:
    get:
      tags: [Auth]
      responses:
        "200":
          description: Current user's profile settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPayload"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPayload"
      responses:
        "200":
          description: Updated profile settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPayload"
        "400":
          description: Invalid settings payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /version:
    get:
      tags: [System]
      parameters:
        - name: check
          in: query
          schema:
            type: boolean
            default: false
        - name: prerelease
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Current version and optional update-check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /system/printers:
    get:
      tags: [System]
      responses:
        "200":
          description: System printers or configured printer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemPrinters"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /system/storage:
    get:
      tags: [System]
      responses:
        "200":
          description: Local data directory usage grouped by category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUsage"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /system/storage/optimize:
    post:
      tags: [System]
      responses:
        "200":
          description: Database optimized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageOptimizeResult"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /system/storage/info:
    get:
      tags: [System]
      responses:
        "200":
          description: Resolved persistent data location and optional legacy-migration receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageLocationInfo"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /system/storage/open-folder:
    post:
      tags: [System]
      description: Opens the configured local data folder. No path, query, or request body is accepted.
      responses:
        "204":
          description: Folder opening started
        "400":
          description: Request contained unsupported input (`storage_folder_request_invalid`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role or valid CSRF token required (`csrf_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Capability unavailable (`storage_folder_open_unavailable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Operating-system folder action failed (`storage_folder_open_failed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /system/storage/migration-receipt/acknowledge:
    post:
      tags: [System]
      description: Atomically acknowledges the retained legacy-migration receipt in the active data folder.
      responses:
        "204":
          description: Receipt acknowledged
        "400":
          description: Request contained unsupported input (`storage_migration_request_invalid`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role or valid CSRF token required (`csrf_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: No receipt is available (`storage_migration_receipt_unavailable`)
          content:
            application/json:
              schema:
