  /vehicles/{id}/decoder-configurations:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      summary: Read physical decoders and saved CV working groups
      description: Viewer, Editor or Admin. Reads one consistent context without changing any data. Model names do not infer physical identity. Unknown installation dates remain null.
      responses:
        "200":
          description: Current decoder comparison
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecoderConfigurationContext'}
        "401": {description: Authentication required}
        "403": {description: Inventory role required}
        "404": {description: Vehicle not found}
  /vehicles/{id}/decoder-configurations/instances:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Confirm a distinct physical decoder instance
      description: Editor or Admin and CSRF required. A current context revision and a new stable instance ID prevent stale or duplicate confirmations. Matching models never merge instances. Maximum request size 64 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecoderInstanceInput'}
      responses:
        "201":
          description: Saved decoder context
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecoderConfigurationContext'}
        "400": {description: Invalid or incomplete explicit edit}
        "403": {description: Editor or Admin and CSRF required}
        "404": {description: Vehicle not found}
        "409": {description: Stale comparison or instance identity already saved}
  /vehicles/{id}/decoder-configurations/instances/{decoderID}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: decoderID, in: path, required: true, schema: {type: string}}
    put:
      summary: Correct the description of an existing physical decoder
      description: Editor or Admin and CSRF required. Requires a current context revision and every instance field, including empty optional text. The body ID must match the path. Earlier snapshot hardware descriptions remain unchanged. Maximum request size 64 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecoderInstanceInput'}
      responses:
        "200":
          description: Saved decoder context
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecoderConfigurationContext'}
        "400": {description: Invalid or incomplete explicit edit}
        "403": {description: Editor or Admin and CSRF required}
        "404": {description: Vehicle or instance not found}
        "409": {description: Stale comparison}
  /vehicles/{id}/decoder-configurations/installations:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Confirm a new decoder installation episode
      description: Editor or Admin and CSRF required. An instance may have at most one active installation. Unknown installation dates require explicit null. Does not assign CV groups or change the vehicle's descriptive decoder type. Maximum request size 64 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecoderInstallationInput'}
      responses:
        "201":
          description: Saved decoder context
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecoderConfigurationContext'}
        "400": {description: Invalid installation or date}
        "403": {description: Editor or Admin and CSRF required}
        "404": {description: Vehicle or instance not found}
        "409": {description: Stale comparison, duplicate identity or already installed instance}
  /vehicles/{id}/decoder-configurations/installations/{installationID}/removal:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: installationID, in: path, required: true, schema: {type: string}}
    post:
      summary: Confirm removal without rewriting previous CV evidence
      description: Editor or Admin and CSRF required. Unknown removal dates require explicit null. Retains the installation episode and appends the supplied note. Existing CV groups and snapshots retain their identities. Maximum request size 64 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecoderRemovalInput'}
      responses:
        "200":
          description: Saved decoder context
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecoderConfigurationContext'}
        "400": {description: Invalid dates or note}
        "403": {description: Editor or Admin and CSRF required}
        "404": {description: Installation does not belong to this vehicle}
        "409": {description: Stale comparison or episode already removed}
  /vehicles/{id}/decoder-configurations/installations/{installationID}/dates:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: installationID, in: path, required: true, schema: {type: string}}
    put:
      summary: Correct known installation and removal dates explicitly
      description: Editor or Admin and CSRF required. Both nullable date fields are required. Dates must be valid and chronological; a removal date requires a removed episode. Earlier snapshot descriptions remain unchanged. Maximum request size 64 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecoderInstallationDatesInput'}
      responses:
        "200":
          description: Saved decoder context
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecoderConfigurationContext'}
        "400": {description: Invalid dates or state}
        "403": {description: Editor or Admin and CSRF required}
        "404": {description: Installation does not belong to this vehicle}
        "409": {description: Stale comparison}
  /vehicles/{id}/decoder-configurations/workspaces:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Create an empty named CV working group
      description: Editor or Admin and CSRF required. A new stable group identity and a distinct trimmed label create an unassigned manual workspace. No CVs, hardware or measurement history are inferred. Maximum request size 64 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecoderCVWorkspaceInput'}
      responses:
        "201":
          description: Saved decoder context
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecoderConfigurationContext'}
        "400": {description: Invalid working label or identity}
        "403": {description: Editor or Admin and CSRF required}
        "404": {description: Vehicle not found}
        "409": {description: Stale comparison or group identity/label already exists}
  /vehicles/{id}/decoder-configurations/workspaces/{workspaceID}/assignment:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
    put:
      summary: Confirm or clear a working group's physical installation
      description: Editor or Admin and CSRF required. First retains a checkpoint of the previous working state and hardware, then changes only the current association. A new association must be an active installation in this vehicle. Never rewrites CV labels or old snapshots. Maximum request size 64 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecoderCVAssignmentInput'}
      responses:
        "200":
          description: Saved decoder context
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecoderConfigurationContext'}
        "400": {description: Invalid or foreign installation}
        "403": {description: Editor or Admin and CSRF required}
        "404": {description: Vehicle or group not found}
        "409": {description: Stale comparison, unchanged association or snapshot identity already saved}
  /vehicles/{id}/decoder-configurations/workspaces/{workspaceID}/checkpoints:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: workspaceID, in: path, required: true, schema: {type: string}}
    post:
      summary: Record the saved CV working group as an immutable partial state
      description: Editor or Admin and CSRF required. Captures saved CVs, actual histories and available sources atomically with audit. Unsaved browser drafts are excluded. The recording time does not claim a complete measurement or a common source export time. Maximum request size 64 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecoderCVCheckpointInput'}
      responses:
        "201":
          description: Saved decoder context including the new snapshot summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecoderConfigurationContext'}
        "400": {description: Invalid checkpoint identity or note}
        "403": {description: Editor or Admin and CSRF required}
        "404": {description: Vehicle or group not found}
        "409": {description: Stale comparison or checkpoint identity already saved}
  /decoder-configurations/snapshots:
    get:
      summary: List immutable partial CV working states
      description: Viewer, Editor or Admin. Historical vehicle labels and inventory numbers remain available after vehicle deletion. This list does not include CV payloads or internal storage references.
      parameters:
        - name: vehicleId
          in: query
          required: false
          schema: {type: string}
          description: Optional historical vehicle ID, including deleted inventory.
      responses:
        "200":
          description: Archived partial working states, most recently recorded first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DecoderCVSnapshotSummary'}
        "401": {description: Authentication required}
        "403": {description: Inventory role required}
  /decoder-configurations/snapshots/{snapshotID}:
    parameters:
      - name: snapshotID
        in: path
        required: true
        schema: {type: string}
    get:
      summary: Read a complete recorded partial CV working state
      description: Viewer, Editor or Admin. Preserves unknown historic values, raw profiles, individual source timestamps and real value histories. The recording time is not a measurement/export time. No current vehicle is required. Unassigned hardware is null; missing originals remain explicitly unavailable.
      responses:
        "200":
          description: Immutable recorded evidence and original source metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecoderCVSnapshot'}
        "401": {description: Authentication required}
        "403": {description: Inventory role required}
        "404": {description: Snapshot not found}
  /decoder-configurations/snapshots/{snapshotID}/sources/{sourceID}/download:
    parameters:
      - name: snapshotID
        in: path
        required: true
        schema: {type: string}
      - name: sourceID
        in: path
        required: true
        schema: {type: string}
    get:
      summary: Download a retained original CV source privately
      description: Viewer, Editor or Admin. Reads only the source blob retained by this snapshot. Remains available after deleting the live file, workspace or vehicle. Never substitutes another live file or reads a supplied filesystem path.
      responses:
        "200":
          description: Original bytes as an attachment
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "401": {description: Authentication required}
        "403": {description: Inventory role required}
        "404": {description: Snapshot source not found}
        "410": {description: Original content was recorded as unavailable}
  /catalog/{targetType}/{id}:
    parameters:
      - name: targetType
        in: path
        required: true
        schema: {type: string, enum: [vehicle, set]}
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      summary: Read the saved catalog assignment and immutable revisions
      description: Viewer, Editor or Admin. Reads one consistent comparison including current saved fields, pinned revision, individual overrides and unresolved proposals. Does not fill relationships or adopt values. The comparison revision also guards assignment changes with identical visible values.
      responses:
        "200":
          description: Saved catalog comparison
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VehicleCatalogContext'}
        "400":
          description: Invalid target type
        "403":
          description: Inventory role required
        "404":
          description: Target not found
  /catalog/{targetType}/{id}/revisions:
    parameters:
      - name: targetType
        in: path
        required: true
        schema: {type: string, enum: [vehicle, set]}
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Create and explicitly assign an immutable catalog revision
      description: Editor or Admin and CSRF required. A current catalog comparison and explicit field selection protect existing data. Unselected owned values and other targets remain unchanged. Legacy proposals are retained as immutable revisions before activation. Request limit is 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VehicleCatalogRevisionInput'}
      responses:
        "201":
          description: Confirmed saved assignment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VehicleCatalogContext'}
        "400":
          description: Invalid confirmation or JSON
        "403":
          description: Editor or Admin and CSRF required
        "404":
          description: Target or own-article revision not found
        "409":
          description: Comparison changed or revision identity already saved; reload and review before another confirmation
  /catalog/{targetType}/{id}/adoption:
    parameters:
      - name: targetType
        in: path
        required: true
        schema: {type: string, enum: [vehicle, set]}
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Adopt selected fields from a revision of the existing article
      description: Editor or Admin and CSRF required. A current catalog comparison and explicit field selection protect existing data. Unselected owned values and other targets remain unchanged. Legacy proposals are retained as immutable revisions before activation. Request limit is 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VehicleCatalogAdoptionInput'}
      responses:
        "200":
          description: Confirmed saved assignment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VehicleCatalogContext'}
        "400":
          description: Invalid confirmation or JSON
        "403":
          description: Editor or Admin and CSRF required
        "404":
          description: Target or own-article revision not found
        "409":
          description: Comparison changed or revision identity already saved; reload and review before another confirmation
  /catalog/legacy-backfill:
    get:
      summary: Report catalog assignments without changing inventory
      description: Admin only. Shows unlinked entities, pinned revisions, individual overrides and differences. Legacy fields remain authoritative during backfill.
      responses:
        "200":
          description: Current mapping and difference report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VehicleCatalogBackfillReport'}
        "403":
          description: Admin role required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Problem'}
    post:
      summary: Complete missing legacy catalog assignments atomically
      description: Admin and CSRF required. Reuses known set membership; identical manufacturer/article numbers never merge independent vehicles. Existing links, revisions and legacy inventory fields remain unchanged. Repeating a completed backfill adds no rows or audit events.
      responses:
        "200":
          description: Completed mapping and difference report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VehicleCatalogBackfillReport'}
        "403":
          description: Admin role and CSRF token required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Problem'}
  /backup/export:
