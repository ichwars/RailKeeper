      description: >
        The normal ECoS read collects the roster, saved function keys and full indexed CV exports.
        Where private decryption configuration is available, one configuration backup is fetched
        internally and checked as another source. No separate file upload is required.
        No TCP CV probes, decoder programming or control requests are used in this workflow.
        Conflicting full register addresses are retained as source evidence and omitted from
        importable CV values. Unverified serialized-cache candidates never become known readings.
        Complete snapshots are reused for vehicle adoption. This read has a bounded 90-second context.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
