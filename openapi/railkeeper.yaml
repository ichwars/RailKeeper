  /valuations/summary:
    get:
      tags: [Overview]
      summary: Summarize dated manual valuations with explicit coverage by currency
      description: Viewer, Editor or Admin required. Messe is excluded. No exchange rates, fabricated history or external requests.
      parameters:
        - name: asOf
          in: query
          description: Valuation date; defaults to the current UTC date.
          schema: {type: string, format: date}
      responses:
        "200":
          description: Exact totals and missing valuation count
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VehicleValuationSummary"}
        "400": {description: Invalid date}
        "401": {description: Authentication required}
        "403": {description: Inventory read role required}
        "500": {description: Summary could not be calculated}
        "503": {description: Valuation service unavailable}
  /vehicles/{id}/valuations:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Vehicles]
      summary: Read a page of manual vehicle valuations, including corrections
      description: Viewer, Editor or Admin required. Entries are ordered by valuation date, recording time and ID descending.
      parameters:
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}
      responses:
        "200":
          description: Up to 100 entries and total count
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VehicleValuationHistory"}
        "400": {description: Invalid offset}
        "401": {description: Authentication required}
        "403": {description: Inventory read role required}
        "404": {description: Vehicle not found}
        "500": {description: History unavailable}
        "503": {description: Valuation service unavailable}
    post:
      tags: [Vehicles]
      summary: Record a manual valuation or append an immutable correction
      description: Editor or Admin and CSRF required. Predecessor check, row and audit commit atomically. An identical ID/content replay has no second effect; concurrent corrections conflict. Existing purchase/list prices remain unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VehicleValuationInput"}
      responses:
        "201":
          description: Recorded entry, or existing identical entry after replay
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VehicleValuation"}
        "400": {description: Invalid valuation or JSON}
        "401": {description: Authentication required}
        "403": {description: Editor role and CSRF required}
        "404": {description: Vehicle or predecessor not found}
        "409": {description: Predecessor already corrected or ID reused with other content}
        "500": {description: No definite save acknowledgment; reload before retrying}
        "503": {description: Valuation service unavailable}
  /vehicles/{id}/valuations/export:
    get:
      tags: [Vehicles]
      summary: Download the complete valuation history as JSON
      description: Viewer, Editor or Admin required. A single read transaction preserves every history row, identity, source, date and correction relationship. Complete installation-independent restoration uses application backup format 28.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Complete history without pagination
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VehicleValuationExport"}
        "401": {description: Authentication required}
        "403": {description: Inventory read role required}
