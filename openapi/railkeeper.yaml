openapi: 3.1.0
info:
  title: RailKeeper API
  version: 0.1.0
servers:
  - url: /api/v1
tags:
  - name: Setup
  - name: Auth
  - name: System
  - name: Users
  - name: Vehicles
  - name: Overview
  - name: InventoryNumbers
  - name: MasterData
  - name: ArticleSearch
  - name: Backup
  - name: Audit
  - name: Exhibition
  - name: Accessories
  - name: DataTransfer
  - name: DigitalCenters
  - name: BugReports
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rk_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required together with the session cookie for API mutations.
  schemas:
    VehicleFunctionInput:
      type: object
      properties:
        name: {type: string, maxLength: 120}
        symbolKey: {type: string, maxLength: 80}
        functionType: {type: string, enum: [standard, sound, licht, kupplung, rauch, sonderfunktion]}
        mode: {type: string, enum: [dauer, moment]}
        directionDependent:
          type: boolean
          nullable: true
          description: Confirmed direction dependency; null means unknown. Independent of inversion.
        inverted:
          type: boolean
          nullable: true
          description: Confirmed inversion; null means unknown. Never inferred from direction dependency.
        legacyDirectionDependent:
          type: boolean
          nullable: true
          description: Preserved ambiguous value from the old mislabelled checkbox, not a confirmed flag. An existing legacy reference is never overwritten.
        flagsVersion:
          type: integer
          enum: [0, 1, 2]
          default: 0
          description: Set 2 for independent nullable flags. Missing/older versions preserve supplied flags as ambiguous legacy data and cannot replace confirmed flags.
        notes: {type: string, maxLength: 1000}
    VehicleFunctionChange:
      type: object
      required: [functionKey, expectedRevision]
      description: Staged function change committed atomically with the vehicle. An empty expectedRevision requires a new key; otherwise it must match the revision read from the vehicle. Conflicts return 409 without applying any vehicle, image or function changes. Omitting functionChanges preserves all functions.
      properties:
        functionKey: {type: string, pattern: '^F([0-9]|[12][0-9]|3[01])$'}
        expectedRevision: {type: string, pattern: '^([0-9a-f]{64})?$'}
        value: {$ref: '#/components/schemas/VehicleFunctionInput'}
        delete: {type: boolean, default: false}
      oneOf:
        - required: [value]
          properties:
            delete: {const: false}
        - required: [delete]
          properties:
            delete: {const: true}
          not:
            required: [value]
    VehicleFunction:
      allOf:
        - $ref: '#/components/schemas/VehicleFunctionInput'
        - type: object
          required: [id, vehicleId, functionKey, functionType, mode, directionDependent, inverted, flagsVersion, sortOrder, createdAt, updatedAt, revision]
          properties:
            id: {type: string}
            vehicleId: {type: string}
            functionKey: {type: string, pattern: '^F([0-9]|[12][0-9]|3[01])$'}
            functionType: {type: string}
            mode: {type: string}
            directionDependent: {type: [boolean, "null"]}
            inverted: {type: [boolean, "null"]}
            flagsVersion: {type: integer, enum: [2], default: 2}
            sortOrder: {type: integer}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
            revision: {type: string, pattern: '^[0-9a-f]{64}$', readOnly: true}
    Problem:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    TransferDirection:
      type: string
      enum: [import, export]
    TransferFormat:
      type: string
      enum: [csv, railkeeper-json]
    TransferArea:
      type: string
      enum: [vehicles, accessories, exhibitionLists]
    TransferJobState:
      type: string
      enum: [draft, reading, review_required, ready, running, completed, completed_with_warnings, failed, cancelled]
    TransferJobStage:
      type: string
      enum: [created, snapshot, preview, review, completed, failed, cancelled]
    TransferIssueSeverity:
      type: string
      enum: [warning, error]
    TransferIssueResolution:
      type: string
      enum: [replace, merge, copy, skip, use_existing, create, link]
    TransferProposedAction:
      type: string
      enum: [create, replace, use_existing, copy]
    TransferProposedResolution:
      type: string
      enum: [replace, merge, copy, skip, use_existing, create, link, replace_or_copy]
    DataTransferProfile:
      type: object
      required: [id, name, direction, format, areas, options, enabled, createdByUserId, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        direction:
          $ref: "#/components/schemas/TransferDirection"
        format:
          $ref: "#/components/schemas/TransferFormat"
        areas:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TransferArea"
        options:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
        createdByUserId:
          type: string
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DataTransferProfileInput:
      type: object
      required: [name, direction, format, areas]
      properties:
        name:
          type: string
          minLength: 1
        direction:
          $ref: "#/components/schemas/TransferDirection"
        format:
          $ref: "#/components/schemas/TransferFormat"
        areas:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TransferArea"
        options:
          type: object
          additionalProperties: true
    DataTransferExportJobInput:
      type: object
      required: [profileId]
      properties:
        profileId:
          type: string
          minLength: 1
    DataTransferImportJobInput:
      type: object
      required: [profileId]
      properties:
        profileId:
          type: string
          minLength: 1
    DataTransferIssueResolutionInput:
      type: object
      required: [resolution]
      properties:
        resolution:
          $ref: "#/components/schemas/TransferIssueResolution"
          minLength: 1
    DataTransferImportConfirmationInput:
      type: object
      required: [confirm, expectedRevision]
      properties:
        confirm:
          type: boolean
        expectedRevision:
          type: integer
          minimum: 1
    DataTransferJob:
      type: object
      required: [id, profileId, profileName, direction, format, areas, options, state, stage, packageVersion, revision,
        sourceName, sourceSha256, totalRecords, readyRecords, warningRecords, errorRecords, preview, createdByUserId,
        confirmedByUserId, confirmedAt, completedAt, resultMessage, createdAt, updatedAt]
      properties:
        id:
          type: string
        profileId:
          type: string
        profileName:
          type: string
        direction:
          $ref: "#/components/schemas/TransferDirection"
        format:
          $ref: "#/components/schemas/TransferFormat"
        areas:
          type: array
          items:
            $ref: "#/components/schemas/TransferArea"
        options:
          type: object
          additionalProperties: true
        state:
          $ref: "#/components/schemas/TransferJobState"
        stage:
          $ref: "#/components/schemas/TransferJobStage"
        sourceName:
          type: string
        sourceSha256:
          type: string
        packageVersion:
          type: integer
        revision:
          type: integer
          minimum: 1
        totalRecords:
          type: integer
        readyRecords:
          type: integer
        warningRecords:
          type: integer
        errorRecords:
          type: integer
        preview:
          type: object
          additionalProperties: true
        createdByUserId:
          type: string
        confirmedByUserId:
          type: string
        confirmedAt:
          type: string
        completedAt:
          type: string
        resultMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DataTransferArtifact:
      type: object
      required: [id, jobId, relativePath, displayName, mimeType, sizeBytes, sha256, deletedAt, createdAt]
      properties:
        id:
          type: string
        jobId:
          type: string
        relativePath:
          type: string
        displayName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        sha256:
          type: string
        deletedAt:
          type: string
        createdAt:
          type: string
          format: date-time
    DataTransferExportResult:
      type: object
      required: [job, artifact, openFolderAvailable]
      properties:
        job:
          $ref: "#/components/schemas/DataTransferJob"
        artifact:
          $ref: "#/components/schemas/DataTransferArtifact"
        openFolderAvailable:
          type: boolean
    DataTransferIssue:
      type: object
      required: [id, jobId, area, recordKey, rowNumber, field, severity, code, message, proposedResolution,
        selectedResolution, createdAt, updatedAt]
      properties:
        id:
          type: string
        jobId:
          type: string
        area:
          $ref: "#/components/schemas/TransferArea"
        recordKey:
          type: string
        rowNumber:
          type: [integer, "null"]
        field:
          type: string
        severity:
          $ref: "#/components/schemas/TransferIssueSeverity"
        code:
          type: string
          description: >-
            Stable conflict or validation code. Vehicle-set groups additionally use
            duplicate_vehicle_set_inventory_number and vehicle_set_member_external_conflict.
        message:
          type: string
        proposedResolution:
          oneOf:
            - $ref: "#/components/schemas/TransferProposedResolution"
            - type: string
              const: ""
        selectedResolution:
          oneOf:
            - $ref: "#/components/schemas/TransferIssueResolution"
            - type: string
              const: ""
        createdAt:
          type: string
        updatedAt:
          type: string
    DataTransferPreviewRecord:
      type: object
      required: [area, recordKey, classification, proposedAction, data]
      properties:
        area:
          $ref: "#/components/schemas/TransferArea"
        recordKey:
          type: string
        rowNumber:
          type: integer
        classification:
          type: string
          enum: [ready, warning, error]
        proposedAction:
          $ref: "#/components/schemas/TransferProposedAction"
        targetId:
          type: string
        targetUpdatedAt:
          type: string
        targetFingerprint:
          type: string
          description: SHA-256 fingerprint of the complete transferable target aggregate at preview time.
        data:
          type: object
          additionalProperties: true
    DataTransferVehicleSetMember:
      type: object
      required: [vehicleId, vehicleInventoryNumber, position]
      properties:
        vehicleId:
          type: string
          description: Source vehicle ID used only to resolve members inside the transfer package.
        vehicleInventoryNumber:
          type: string
        position:
          type: integer
          minimum: 1
        label:
          type: string
    DataTransferVehicleSet:
      type: object
      required: [inventoryNumber, name, manufacturer, articleNumber, articleSourceUrl, gauge, epoch, railwayCompany, category, gattung, description, ean, productionPeriod, listPrice, acquisitionType, acquiredFrom, purchasePrice, purchaseDate, storageLocation, storageDetails, condition, conditionDetails, packaging, members]
      properties:
        id:
          type: string
        inventoryNumber:
          type: string
        name:
          type: string
        manufacturer:
          type: string
        articleNumber:
          type: string
        articleSourceUrl:
          type: string
        gauge:
          type: string
        epoch:
          type: string
        railwayCompany:
          type: string
        category:
          type: string
        gattung:
          type: string
        description:
          type: string
        ean:
          type: string
        productionPeriod:
          type: string
        listPrice:
          type: string
        acquisitionType:
          type: string
        acquiredFrom:
          type: string
        purchasePrice:
          type: string
        purchaseDate:
          type: string
        storageLocation:
          type: string
        storageDetails:
          type: string
        condition:
          type: string
        conditionDetails:
          type: string
        packaging:
          type: string
        members:
          type: array
          minItems: 2
          items: {$ref: "#/components/schemas/DataTransferVehicleSetMember"}
        createdAt:
          type: string
        updatedAt:
          type: string
    DataTransferVehicleSetDiagnostic:
      type: object
      required: [rowNumber, field, code]
      properties:
        rowNumber:
          type: integer
          minimum: 0
        field:
          type: string
        code:
          type: string
          description: Stable code for an invalid or inconsistent vehicle-set group.
    DataTransferVehicleSetPreview:
      type: object
      required: [recordKey, classification, proposedAction, memberRecordKeys, data]
      properties:
        recordKey:
          type: string
        classification:
          type: string
          enum: [ready, warning, error]
        proposedAction:
          $ref: "#/components/schemas/TransferProposedAction"
        targetId:
          type: string
        targetUpdatedAt:
          type: string
        targetFingerprint:
          type: string
          description: SHA-256 fingerprint of the complete target set and its memberships.
        memberRecordKeys:
          type: array
          minItems: 2
          items:
            type: string
        rowNumbers:
          type: array
          items:
            type: integer
            minimum: 1
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/DataTransferVehicleSetDiagnostic"
        data:
          $ref: "#/components/schemas/DataTransferVehicleSet"
    DataTransferCSVColumnMapping:
      type: object
      required: [index, sourceHeader, normalizedHeader, targetField, origin]
      properties:
        index:
          type: integer
          minimum: 0
        sourceHeader:
          type: string
        normalizedHeader:
          type: string
        targetField:
          type: string
        origin:
          type: string
          enum: [alias, profile, manual, ignored, unmapped]
    DataTransferCSVMappingInput:
      type: object
      required: [columns, saveToProfile]
      properties:
        columns:
          type: array
          items: {$ref: "#/components/schemas/DataTransferCSVColumnMapping"}
        saveToProfile: {type: boolean}
    VehicleTransferField:
      type: object
      required: [key, labelDE, labelEN, kind, aliases]
      properties:
        key:
          type: string
        labelDE:
          type: string
        labelEN:
          type: string
        kind:
          type: string
          enum: [string, integer, boolean]
        aliases:
          type: array
          items:
            type: string
    DataTransferPreview:
      type: object
      required: [job, records, issues, totalRecords, readyRecords, warningRecords, errorRecords]
      properties:
        job:
          $ref: "#/components/schemas/DataTransferJob"
        records:
          type: array
          items:
            $ref: "#/components/schemas/DataTransferPreviewRecord"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/DataTransferIssue"
        totalRecords:
          type: integer
          description: Number of vehicle and other area records. Vehicle-set metadata is not counted separately.
        readyRecords:
          type: integer
          description: Ready area records. Vehicle-set metadata is not counted separately.
        warningRecords:
          type: integer
          description: Area records with warnings. Vehicle-set metadata is not counted separately.
        errorRecords:
          type: integer
          description: Area records with errors. Vehicle-set metadata is not counted separately.
        csvMapping:
          type: array
          items:
            $ref: "#/components/schemas/DataTransferCSVColumnMapping"
        vehicleFields:
          type: array
          items:
            $ref: "#/components/schemas/VehicleTransferField"
        vehicleSets:
          type: array
          description: Detected vehicle-set groups reviewed and resolved as one unit.
          items:
            $ref: "#/components/schemas/DataTransferVehicleSetPreview"
    DataTransferSummary:
      type: object
      required: [openJobs, selectedRecords, lastExportAt, artifactCount, artifactBytes,
        openFolderAvailable, artifactDirectory]
      properties:
        openJobs:
          type: integer
          minimum: 0
        selectedRecords:
          type: integer
          minimum: 0
        lastExportAt:
          type: string
        artifactCount:
          type: integer
          minimum: 0
        artifactBytes:
          type: integer
          format: int64
          minimum: 0
        openFolderAvailable:
          type: boolean
        artifactDirectory:
          type: string
    DataTransferJobDetails:
      type: object
      required: [job, issues, artifacts]
      properties:
        job:
          $ref: "#/components/schemas/DataTransferJob"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/DataTransferIssue"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/DataTransferArtifact"
    VehicleValuationFields:
      type: object
      required: [id, amount, currency, valuedOn, source]
      properties:
        id: {type: string, pattern: '^[0-9a-f]{32}$'}
        amount:
          type: string
          description: Nonnegative exact decimal, at most 12 integer and six fractional digits. Dot or comma always means the decimal separator; do not use grouping. Stored/returned values use a dot.
        currency:
          type: string
          description: Three ASCII letters, trimmed and uppercased. No currency conversion or external code lookup.
        valuedOn: {type: string, format: date}
        source: {type: string, minLength: 1, maxLength: 1000}
        notes: {type: string, maxLength: 4000, default: ""}
        replacesId:
          type: string
          default: ""
          description: Empty for a new estimate, otherwise the uncorrected predecessor ID. Corrections append a row and cannot fork.
        withdrawn:
          type: boolean
          default: false
          description: Only a correction may withdraw an earlier estimate. Original rows are retained.
    VehicleValuationInput:
      allOf:
        - {$ref: "#/components/schemas/VehicleValuationFields"}
      unevaluatedProperties: false
      description: Reuse the same ID and content after an uncertain response; an identical replay returns the existing row. Changed content under that ID conflicts.
    VehicleValuation:
      allOf:
        - {$ref: "#/components/schemas/VehicleValuationFields"}
        - type: object
          required: [vehicleId, recordedAt, replacedById, notes, replacesId, withdrawn]
          properties:
            vehicleId: {type: string}
            recordedAt: {type: string, format: date-time}
            replacedById: {type: string}
            notes: {type: string}
            replacesId: {type: string}
            withdrawn: {type: boolean}
      unevaluatedProperties: false
    VehicleValuationHistory:
      type: object
      required: [entries, total]
      properties:
        entries:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/VehicleValuation"}
        total: {type: integer, minimum: 0}
    VehicleValuationExport:
      type: object
      required: [format, version, vehicleId, exportedAt, entries]
      properties:
        format: {type: string, const: railkeeper-valuations}
        version: {type: integer, const: 1}
        vehicleId: {type: string}
        exportedAt: {type: string, format: date-time}
        entries:
          type: array
          description: Entire immutable history, including corrected and withdrawn entries. Not limited to the history page size.
          items: {$ref: "#/components/schemas/VehicleValuation"}
    VehicleValuationSummary:
      type: object
      required: [asOf, vehicleCount, valuedVehicles, missingVehicles, totals]
      description: Latest uncorrected and nonwithdrawn estimate per vehicle with valuedOn at or before asOf, using current knowledge including retrospective corrections. Vehicle set prices are not added. Currencies remain separate, and no past estimates are inferred.
      properties:
        asOf: {type: string, format: date}
        vehicleCount: {type: integer, minimum: 0}
        valuedVehicles: {type: integer, minimum: 0}
        missingVehicles: {type: integer, minimum: 0}
        totals:
          type: array
          items:
            type: object
            required: [currency, amount, vehicles]
            properties:
              currency: {type: string, pattern: '^[A-Z]{3}$'}
              amount: {type: string}
              vehicles: {type: integer, minimum: 0}
    OverviewValuation:
      type: object
      required:
        - vehicleListValue
        - vehiclePurchaseValue
        - accessoryListValue
        - accessoryPurchaseCost
        - excludedForeignCurrencyPurchases
      properties:
        vehicleListValue:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        vehiclePurchaseValue:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        accessoryListValue:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        accessoryPurchaseCost:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        excludedForeignCurrencyPurchases:
          type: integer
          minimum: 0
    SetupStatus:
      type: object
      required: [setupRequired, cookieSecure]
      properties:
        setupRequired:
          type: boolean
        cookieSecure:
          type: boolean
          description: Effective Secure flag for session cookies, independent of forwarded request headers.
    CreateAdminRequest:
      type: object
      required: [username, email, password, setupCode]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 12
        email:
          type: string
          format: email
        setupCode:
          type: string
          minLength: 32
          maxLength: 128
          description: One-use code from the protected local setup-code.txt file. Never returned by the API.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        twoFactorCode:
          type: string
          description: A current TOTP code that has not already been used for activation or another action.
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 12
    Session:
      type: object
      required: [username, roles, csrfToken, twoFactorEnabled]
      properties:
        username:
          type: string
        roles:
          type: array
          items:
            type: string
        csrfToken:
          type: string
        twoFactorEnabled:
          type: boolean
    TwoFactorStatus:
      type: object
      required: [enabled, prepared]
      properties:
        enabled:
          type: boolean
        prepared:
          type: boolean
        enabledAt:
          type: string
          format: date-time
        username:
          type: string
        otpauthUrl:
          type: string
        secret:
          type: string
    TwoFactorEnableRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: A current unused TOTP code. Successful activation consumes this code.
    TwoFactorDisableRequest:
      type: object
      required: [currentPassword]
      properties:
        currentPassword:
          type: string
        code:
          type: string
    SessionRecord:
      type: object
      required: [id, userId, username, createdAt, expiresAt, active]
      properties:
        id:
          type: string
        userId:
          type: string
        username:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        active:
          type: boolean
    Role:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    UserAccount:
      type: object
      required: [id, username, roles, createdAt, twoFactorEnabled]
      properties:
        id:
          type: string
        username:
          type: string
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        twoFactorEnabled:
          type: boolean
    UserAccountInput:
      type: object
      required: [username, roles]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 12
          description: Required when creating a user. Omit or leave empty on update to keep the current password.
        roles:
          type: array
          minItems: 1
          items:
            type: string
    AuditLogEntry:
      type: object
      required: [id, action, createdAt, detailsJson]
      properties:
        id:
          type: string
        actorUserId:
          type: string
        actorUsername:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        createdAt:
          type: string
          format: date-time
        detailsJson:
          type: string
    AuditLogResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
    SystemPrinters:
      type: object
      required: [status, message, printers]
      properties:
        status:
          type: string
          enum: [available, configured, unavailable]
        message:
          type: string
        defaultPrinter:
          type: string
        printers:
          type: array
          items:
            type: object
            required: [id, name, isDefault]
            properties:
              id:
                type: string
              name:
                type: string
              isDefault:
                type: boolean
    SMTPSettings:
      type: object
      required: [enabled, publicUrl, host, port, username, from, tlsMode, passwordConfigured]
      properties:
        enabled:
          type: boolean
        publicUrl:
          type: string
        host:
          type: string
        port:
          type: string
        username:
          type: string
        from:
          type: string
        tlsMode:
          type: string
          enum: [starttls, implicit, none]
        passwordConfigured:
          type: boolean
    SMTPSettingsInput:
      type: object
