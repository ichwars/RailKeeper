  /vehicles/{id}/cv-values/import:
    post:
      tags: [Vehicles]
      summary: Import a reviewed selection of CV values atomically
      description: Requires Editor or Admin and CSRF. Upserts by vehicle, exact decoder profile, CV number and index pair. Duplicate input keys, unknown field names, missing/null values and foreign source attachments are rejected. All selected values and value histories commit together, or the entire import rolls back. Request limit 8 MiB. This stores inventory data and never writes to a decoder.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    $ref: "#/components/schemas/VehicleCVValueInput"
      responses:
        "200":
          description: All selected values were imported
          content:
            application/json:
              schema:
                type: object
                required: [imported]
                properties:
                  imported:
                    type: integer
        "400":
          description: Invalid JSON, invalid values/index pair, duplicate identity, foreign source file or exceeded limits
        "403":
          description: Role or CSRF check failed
        "404":
          description: Vehicle not found
        "500":
          description: Import failed and all changes rolled back
