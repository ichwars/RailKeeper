  /digital-centers/ecos/backup-import:
    post:
      tags: [DigitalCenters]
      deprecated: true
      summary: Decrypt and inspect an ECoS backup as a separate offline comparison
      description: >
        Maintenance compatibility endpoint. Normal users read all sources through the configured
        ECoS read-session workflow; there is no separate backup upload in that UI.
        Admin only. The complete encrypted upload and its integrity are checked before a session
        is created. Never queries or restores a device and never creates vehicles or imports CVs.
        Private decryption configuration remains on the server. Existing comparisons provide optional
        names and decoder-profile context, not newly recovered backup identity. Without station
        confirmation all vehicle links remain empty. Explicit confirmation permits only unambiguous
        existing mappings whose saved identity, address and protocol agree. importedAt is the review
        creation time, not a claimed backup export time. The resulting session has no device capabilities.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: X-RailKeeper-Confirm-Station
          in: header
          schema: {type: boolean, default: false}
        - name: X-RailKeeper-Backup-Station
          in: header
          description: Current selected ECoS host, required when station confirmation is true. Never used as a network target.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 8388608
      responses:
        "201":
          description: A separate persisted offline review; vehicle records remain unchanged
          content:
            application/json:
              schema:
                type: object
                required: [session, summary]
                additionalProperties: false
                properties:
                  session:
                    $ref: "#/components/schemas/DigitalCenterReadSession"
                  summary:
                    type: object
                    required: [stationSerial, profiles, cvValues, importedAt, linkedVehicles, identitySource]
                    additionalProperties: false
                    properties:
                      stationSerial: {type: integer, minimum: 1, maximum: 4294967295}
                      profiles: {type: integer, minimum: 1, maximum: 64}
                      cvValues: {type: integer, minimum: 0, maximum: 524288}
                      importedAt: {type: string, format: date-time}
                      linkedVehicles: {type: integer, minimum: 0, maximum: 64}
                      identitySource: {type: string, enum: [saved_comparison]}
        "400":
          description: Invalid station-confirmation header
        "401":
          description: Authentication required
        "403":
          description: Admin role and valid CSRF token required
        "409":
          description: The confirmed ECoS host no longer matches the configuration
        "413":
          description: Encrypted upload exceeds 8 MiB
        "415":
          description: Raw application/octet-stream required
        "422":
          description: Damaged, unsupported or oversized decrypted backup contents
        "503":
          description: Private server decryption configuration is unavailable or cannot unlock the key
