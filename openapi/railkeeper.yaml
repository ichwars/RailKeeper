            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /backup/restore:
    post:
      tags: [Backup]
      summary: Restore a local RailKeeper backup
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Restore summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupImportResult"
        "400":
          description: Invalid backup file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role required
          content:
