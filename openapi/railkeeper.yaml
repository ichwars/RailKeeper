        quantity:
          type: integer
          minimum: 1
        vehicleId:
          type: string
        placement:
          type: string
        digitalAddress:
          type: string
        decoderOutput:
          type: string
        connection:
          type: string
        wiringNotes:
          type: string
        status:
          type: string
          enum: [active, fulfilled, cancelled]
        previousCondition:
          type: string
          enum: [ready, maintenance_due, defective, unknown]
        condition:
          type: string
          enum: [ready, maintenance_due, defective, unknown]
        removalDisposition:
          type: string
          enum: [stored, maintenance, defective, retired]
        actor:
          type: string
        occurredAt:
          type: string
          format: date-time
    AccessoryUsageHistory:
      type: object
      required: [productId, events]
      properties:
        productId:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/AccessoryUsageEvent"
    AccessoryAssetInput:
      type: object
      properties:
        inventoryNumber:
          type: string
        serialNumber:
          type: string
        condition:
          type: string
          enum: [ready, maintenance_due, defective, unknown]
        lifecycle:
          type: string
          enum: [stored, maintenance, retired]
        storageLocationId:
          type: string
        purchaseDate:
          type: string
        purchasePrice:
          type: string
        warrantyUntil:
          type: string
        notes:
          type: string
    AccessoryAllocationTarget:
      type: object
      required: [vehicleId]
      properties:
        vehicleId:
          type: string
    AccessoryReservation:
      allOf:
        - $ref: "#/components/schemas/AccessoryAllocationTarget"
        - type: object
          required: [id, productId, locationId, quantity, status, createdBy, createdAt, updatedAt]
          properties:
            id:
              type: string
            productId:
              type: string
            assetId:
              type: string
            locationId:
              type: string
            quantity:
              type: integer
              minimum: 1
            placement:
              type: string
            digitalAddress:
              type: string
            decoderOutput:
              type: string
            connection:
              type: string
            wiringNotes:
              type: string
            status:
              type: string
              enum: [active, fulfilled, cancelled]
            note:
              type: string
            createdBy:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    AccessoryReservationInput:
      allOf:
        - $ref: "#/components/schemas/AccessoryAllocationTarget"
        - type: object
          required: [productId, locationId, quantity]
          properties:
            productId:
              type: string
            assetId:
              type: string
            locationId:
              type: string
            quantity:
              type: integer
              minimum: 1
            placement:
              type: string
            digitalAddress:
              type: string
            decoderOutput:
              type: string
            connection:
              type: string
            wiringNotes:
              type: string
            note:
              type: string
    AccessoryInstallation:
      allOf:
        - $ref: "#/components/schemas/AccessoryAllocationTarget"
        - type: object
          required:
            [id, productId, sourceLocationId, quantity, condition, installedBy, installedAt]
          properties:
            id:
              type: string
            productId:
              type: string
            assetId:
              type: string
            sourceLocationId:
              type: string
            quantity:
              type: integer
              minimum: 1
            placement:
              type: string
            digitalAddress:
              type: string
            decoderOutput:
              type: string
            connection:
              type: string
            wiringNotes:
              type: string
            condition:
              type: string
              enum: [ready, maintenance_due, defective, unknown]
            installedBy:
              type: string
            installedAt:
              type: string
              format: date-time
            removedBy:
              type: string
            removedAt:
              type: string
              format: date-time
            removalDisposition:
              type: string
              enum: [stored, maintenance, defective, retired]
            notes:
              type: string
            removalNotes:
              type: string
    AccessoryInstallationInput:
      allOf:
        - $ref: "#/components/schemas/AccessoryAllocationTarget"
        - type: object
          required: [productId, sourceLocationId, quantity]
          properties:
            reservationId:
              type: string
            productId:
              type: string
            assetId:
              type: string
            sourceLocationId:
              type: string
            quantity:
              type: integer
              minimum: 1
            placement:
              type: string
            digitalAddress:
              type: string
            decoderOutput:
              type: string
            connection:
              type: string
            wiringNotes:
              type: string
            condition:
              type: string
              enum: [ready, maintenance_due, defective, unknown]
            notes:
              type: string
    AccessoryInstallationRemovalInput:
      type: object
      required: [disposition]
      properties:
        disposition:
          type: string
          enum: [stored, maintenance, defective, retired]
        storageLocationId:
          type: string
        notes:
          type: string
      oneOf:
        - properties:
            disposition:
              const: stored
          required: [storageLocationId]
        - properties:
            disposition:
              enum: [maintenance, defective, retired]
          not:
            required: [storageLocationId]
    AccessoryInstallationConditionInput:
      type: object
      required: [condition]
      properties:
        condition:
          type: string
          enum: [ready, maintenance_due, defective, unknown]
    AccessoryAllocationSummary:
      type: object
      required: [productId, owned, stored, reserved, installed, available, missing]
      properties:
        productId:
          type: string
        owned:
          type: integer
          minimum: 0
        stored:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
        installed:
          type: integer
          minimum: 0
        available:
          type: integer
          minimum: 0
        missing:
          type: integer
          minimum: 0
    ExhibitionStatus:
      type: string
      enum: [draft, open, locked, running, completed, archived]
    ExhibitionEntryStatus:
      type: string
      enum: [ready, addressConflict, missing, check, unavailable]
    ExhibitionList:
      type: object
      required: [id, designation, date, endDate, status, revision, locked, entryCount, createdAt, updatedAt]
      properties:
        id:
          type: string
        designation:
          type: string
        date:
          type: string
          format: date
        endDate:
          type: string
          format: date
        location:
          type: string
        description:
          type: string
        organizationNotes:
          type: string
        status:
          $ref: "#/components/schemas/ExhibitionStatus"
        revision:
          type: integer
          minimum: 1
        locked:
          type: boolean
        lockReason:
          type: string
        lockedAt:
          type: string
        completedAt:
          type: string
        archivedAt:
          type: string
        entryCount:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ExhibitionEntry"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExhibitionListInput:
      type: object
      required: [designation, date]
      properties:
        designation:
          type: string
        date:
          type: string
          format: date
        endDate:
          type: string
          format: date
        location:
          type: string
        description:
          type: string
        organizationNotes:
          type: string
        status:
          $ref: "#/components/schemas/ExhibitionStatus"
        expectedRevision:
          type: integer
          minimum: 1
    ExhibitionLockInput:
      type: object
      required: [locked]
      properties:
        locked:
          type: boolean
    ExhibitionEntry:
      type: object
      required: [id, listId, owner, locomotiveName, dtDecoder, sortOrder, availability, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
        listId:
          type: string
        owner:
          type: string
        imageUrl:
          type: string
        locomotiveName:
          type: string
        dtDecoder:
          type: boolean
        decoderNumber:
          type: string
        interfaceName:
          type: string
        availability:
          type: string
          enum: [available, unavailable]
        revision:
          type: integer
          minimum: 1
        functionKeys:
          type: string
        notes:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExhibitionEntryInput:
      type: object
      required: [locomotiveName, dtDecoder]
      properties:
        owner:
          type: string
        imageUrl:
          type: string
        locomotiveName:
          type: string
        dtDecoder:
          type: boolean
        decoderNumber:
          type: string
        interfaceName:
          type: string
        availability:
          type: string
          enum: [available, unavailable]
        expectedRevision:
          type: integer
          minimum: 1
        functionKeys:
          type: string
        notes:
          type: string
        sortOrder:
          type: integer
    ExhibitionSummary:
      type: object
      required: [entryCount, ownerCount, conflictCount, readyCount]
      properties:
        entryCount: { type: integer }
        ownerCount: { type: integer }
        conflictCount: { type: integer }
        readyCount: { type: integer }
    ExhibitionReadiness:
      type: object
      required: [total, addressesChecked, functionsDocumented, imagesPresent, problems]
      properties:
        total: { type: integer }
        addressesChecked: { type: integer }
        functionsDocumented: { type: integer }
        imagesPresent: { type: integer }
        problems: { type: integer }
    ExhibitionConflict:
      type: object
      required: [id, kind, entryIds, excepted]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [address, missing, duplicateVehicle]
        entryIds:
          type: array
          items: { type: string }
        fields:
          type: array
          items: { type: string }
        interfaceName: { type: string }
        address: { type: string }
        dayScopes:
          type: array
          items: { type: string }
        excepted: { type: boolean }
        exceptionReason: { type: string }
    ExhibitionWorkspaceEntry:
      allOf:
        - $ref: "#/components/schemas/ExhibitionEntry"
        - type: object
          required: [status, conflictIds]
          properties:
            status:
              $ref: "#/components/schemas/ExhibitionEntryStatus"
            conflictIds:
              type: array
              items: { type: string }
    ExhibitionWorkspace:
      type: object
      required: [list, summary, readiness, entries, conflicts, dayScopes]
      properties:
        list: { $ref: "#/components/schemas/ExhibitionList" }
        summary: { $ref: "#/components/schemas/ExhibitionSummary" }
        readiness: { $ref: "#/components/schemas/ExhibitionReadiness" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/ExhibitionWorkspaceEntry" }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/ExhibitionConflict" }
        dayScopes:
          type: array
          items: { type: string }
    ExhibitionStatusInput:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/ExhibitionStatus" }
        expectedRevision: { type: integer, minimum: 1 }
        confirmConflicts: { type: boolean }
        reason: { type: string }
    ExhibitionConflictExceptionInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        expectedRevision: { type: integer, minimum: 1 }
paths:
  /setup/status:
    get:
      tags: [Setup]
      security: []
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /setup/admin:
    post:
      tags: [Setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminRequest"
      responses:
        "201":
          description: Admin user created
        "400":
          description: Weak input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Setup already completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/session:
    get:
      tags: [Auth]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/login:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/logout:
    post:
      tags: [Auth]
      responses:
        "204":
          description: Logged out
  /auth/password:
    put:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and other user sessions revoked
        "400":
          description: Weak password or invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Current password invalid or not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/two-factor:
    get:
      tags: [Auth]
      responses:
        "200":
          description: Current user's two-factor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/two-factor/setup:
    post:
      tags: [Auth]
      responses:
        "200":
          description: Two-factor setup secret generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/two-factor/enable:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorEnableRequest"
      responses:
        "200":
          description: Two-factor authentication enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatus"
        "401":
          description: Invalid two-factor code or not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/two-factor/disable:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorDisableRequest"
      responses:
        "204":
          description: Two-factor authentication disabled and other sessions revoked
        "401":
          description: Invalid password/code or not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /profile/settings:
    get:
      tags: [Auth]
      responses:
        "200":
          description: Current user's profile settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPayload"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPayload"
      responses:
        "200":
          description: Updated profile settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPayload"
        "400":
          description: Invalid settings payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /version:
    get:
      tags: [System]
      parameters:
        - name: check
          in: query
          schema:
            type: boolean
            default: false
        - name: prerelease
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Current version and optional update-check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /system/printers:
    get:
      tags: [System]
      responses:
        "200":
          description: System printers or configured printer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemPrinters"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /system/storage:
    get:
      tags: [System]
      responses:
        "200":
          description: Local data directory usage grouped by category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUsage"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /system/storage/optimize:
    post:
      tags: [System]
      responses:
        "200":
          description: Database optimized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageOptimizeResult"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /system/storage/info:
    get:
      tags: [System]
      responses:
        "200":
          description: Resolved persistent data location and optional legacy-migration receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageLocationInfo"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /system/storage/open-folder:
    post:
      tags: [System]
      description: Opens the configured local data folder. No path, query, or request body is accepted.
      responses:
        "204":
          description: Folder opening started
        "400":
          description: Request contained unsupported input (`storage_folder_request_invalid`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role or valid CSRF token required (`csrf_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Capability unavailable (`storage_folder_open_unavailable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Operating-system folder action failed (`storage_folder_open_failed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /system/storage/migration-receipt/acknowledge:
    post:
      tags: [System]
      description: Atomically acknowledges the retained legacy-migration receipt in the active data folder.
      responses:
        "204":
          description: Receipt acknowledged
        "400":
          description: Request contained unsupported input (`storage_migration_request_invalid`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role or valid CSRF token required (`csrf_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: No receipt is available (`storage_migration_receipt_unavailable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Receipt update failed (`storage_migration_acknowledgement_failed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /system/audit-log:
    get:
      tags: [Audit]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Recent security and audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /system/smtp:
    get:
      tags: [System]
      responses:
        "200":
          description: SMTP settings without the stored password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMTPSettings"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SMTPSettingsInput"
      responses:
        "200":
          description: Updated SMTP settings without the stored password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMTPSettings"
        "400":
          description: Invalid SMTP settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /system/smtp/test:
    post:
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SMTPTestRequest"
      responses:
        "200":
          description: Test email was sent
        "400":
          description: SMTP is disabled or recipient is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: SMTP server rejected the test email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /roles:
    get:
      tags: [Users]
      responses:
        "200":
          description: Available roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /users:
    get:
      tags: [Users]
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAccount"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAccountInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "400":
          description: Invalid user data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Duplicate user or last admin protection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /users/{id}:
    put:
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAccountInput"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "400":
          description: Invalid user data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Duplicate user or last admin protection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: User deleted
        "404":
