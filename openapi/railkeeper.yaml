  /digital-centers/read-sessions/{id}/items/{itemID}/cv-read:
    post:
      tags: [DigitalCenters]
      summary: Refresh the combined saved ECoS snapshot, or a legacy base-CV batch
      description: >
        Admin only. Uses the saved session target, never a client-supplied host or CV values.
        Reads stored locomotive-object memory, without decoder programming or control takeover.
        With source=database and startCV=1, reads the bounded XML database export and internally
        checks the configuration backup where configured, preserving explicit CV31/CV32 pages.
        Saved function keys and source disagreements belong to the same snapshot.
        Conflicting registers and unverified binary candidates are excluded from importable values.
        Locomotive identity is checked before and after reading. Without source,
        retains the legacy 32-number scan over CV1–CV1024 with unknown pages. Values may be cached profile defaults.
        Import requires a completed snapshot and preserves existing values at the same full address across profiles.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: itemID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [startCV]
              properties:
                source:
                  type: string
                  enum: [database]
                  description: Read the complete stored database with startCV 1. Omit for the legacy numbered batch reader.
                startCV:
                  type: integer
                  minimum: 1
                  maximum: 993
                  description: Start at 1; then use cvRead.nextCV. Retried cursors return saved progress.
                restart:
                  type: boolean
                  default: false
                  description: Explicitly replace the saved snapshot; allowed only with startCV 1. A database retry without restart returns a committed database snapshot.
      responses:
        "200":
          description: Confirmed result; CV batches update only the comparison workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalCenterWorkItem"
        "400":
          description: Invalid request or unsupported provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Admin role or CSRF check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Read session or work item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Restart the read or check the vehicle mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Invalid or incomplete ECoS response; no CVs imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
